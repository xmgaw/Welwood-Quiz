<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Perfect Love, Imperfect Relationships — Self-Quiz</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#A3165A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Welwood Quiz">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300..600;1,300..600&family=Sorts+Mill+Goudy:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  /* palette sampled from the cover: cream field, magenta title, orange spine,
     wood-brown ink, the two red apples */
  --paper:#FBF0D6;
  --paper-raised:#FFF8E8;
  --paper-sunk:#F1E1C0;
  --ink:#3B2217;
  --ink-soft:#6B5041;
  --ink-faint:#8E735F;
  --magenta:#A3165A;
  --magenta-deep:#7A0F43;
  --magenta-wash:#F6DDE5;
  --ember:#D8691E;
  --ember-deep:#A34C12;
  --ember-wash:#F8E2C6;
  --apple:#9A2B22;
  --apple-hi:#C8652C;
  --apple-deep:#6A1C16;
  --apple-wash:#F3D9D1;
  --wood:#3F1B13;
  --rule:#E5D0AA;
  --green:#56703F;
  --green-wash:#E2E9D0;
  --shadow:0 1px 2px color-mix(in srgb, var(--wood) 6%, transparent), 0 6px 18px -10px color-mix(in srgb, var(--wood) 28%, transparent);
  --display:"Sorts Mill Goudy","Goudy Old Style","Iowan Old Style",Georgia,serif;
  --body:"Crimson Pro","Iowan Old Style",Georgia,serif;
  --ui:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--body);
  font-size:17px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(5rem + env(safe-area-inset-bottom));
}
.wrap{max-width:41rem;margin:0 auto;padding:0 1.35rem}

/* ── the signature: two apples resting on a fading shelf line, from the cover ── */
.shelfrule{
  position:relative;height:2.4rem;margin:2.2rem 0 2rem;
  display:flex;align-items:center;justify-content:center;
}
.shelfrule::before{
  content:"";position:absolute;left:0;right:0;top:1.72rem;height:1.5px;
  background:linear-gradient(to right,transparent,var(--rule) 14%,var(--ember) 50%,var(--rule) 86%,transparent);
}
.shelfrule i{position:relative;display:block;width:3.2rem;height:2.4rem}
.shelfrule i::before,
.shelfrule i::after{
  content:"";position:absolute;bottom:.68rem;border-radius:50% 50% 46% 46%;
  background:radial-gradient(circle at 34% 30%,var(--apple-hi),var(--apple) 52%,var(--apple-deep));
  box-shadow:0 .14rem .16rem -.08rem color-mix(in srgb, var(--wood) 45%, transparent);
}
.shelfrule i::before{left:.2rem;width:1.34rem;height:1.26rem}
.shelfrule i::after{right:.24rem;width:1.2rem;height:1.14rem}

/* ── sticky bar ── */
.topbar{
  position:sticky;top:0;z-index:20;
  background:var(--paper);
  background:color-mix(in srgb, var(--paper) 93%, transparent);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid var(--rule);
  padding-top:env(safe-area-inset-top);
}
.topbar .wrap{display:flex;align-items:center;gap:.85rem;min-height:3.3rem;padding-top:.4rem;padding-bottom:.4rem}
.topbar .tb-back{
  font-family:var(--ui);font-size:.78rem;letter-spacing:.02em;
  background:none;border:0;color:var(--ink-soft);cursor:pointer;padding:.3rem .1rem;
  flex:0 0 auto;
}
.topbar .tb-back:hover{color:var(--magenta-deep)}
.topbar .tb-title{
  flex:1 1 auto;min-width:0;font-family:var(--display);font-weight:400;font-size:1.02rem;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.topbar .tb-meta{
  flex:0 0 auto;font-family:var(--ui);font-size:.74rem;color:var(--ink-faint);
  letter-spacing:.03em;text-align:right;line-height:1.35;
}
.topbar .tb-meta b{display:block;font-weight:600;color:var(--ink-soft);font-size:.8rem}
.progressline{height:2px;background:var(--paper-sunk)}
.progressline > span{display:block;height:100%;background:var(--magenta);transition:width .3s ease}

/* ── typography ── */
h1{
  font-family:var(--display);font-weight:400;font-size:2.15rem;line-height:1.15;
  margin:2.4rem 0 .35rem;letter-spacing:-.005em;color:var(--magenta);
}
h1 em{font-style:italic;font-weight:400;color:var(--ink)}
.subtitle{font-family:var(--ui);font-size:.8rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);margin:2.4rem 0 .2rem}
.subtitle + h1{margin-top:.55rem}
.byline{color:var(--ink-soft);font-size:1.02rem;margin:.3rem 0 0}
.byline .sc{font-variant:small-caps;letter-spacing:.04em;color:var(--magenta-deep)}
h2{font-family:var(--display);font-weight:400;font-size:1.34rem;margin:2.3rem 0 .7rem;letter-spacing:-.003em}
h3{font-family:var(--ui);font-weight:600;font-size:.76rem;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-faint);margin:2rem 0 .8rem}
p{margin:0 0 1rem}
.lede{font-size:1.04rem;color:var(--ink-soft)}

/* ── buttons ── */
.btn{
  font-family:var(--ui);font-size:.92rem;font-weight:500;
  background:var(--ink);color:var(--paper-raised);border:1px solid var(--ink);
  padding:.72rem 1.15rem;border-radius:2px;cursor:pointer;
  transition:background .15s,border-color .15s,color .15s;
  line-height:1.3;
}
.btn:hover{background:var(--magenta-deep);border-color:var(--magenta-deep)}
.btn:disabled{opacity:.4;cursor:default}
.btn:disabled:hover{background:var(--ink);border-color:var(--ink)}
.btn-quiet{background:transparent;color:var(--ink-soft);border:1px solid var(--rule)}
.btn-quiet:hover{background:var(--paper-raised);color:var(--magenta-deep);border-color:var(--magenta)}
.btn-sm{font-size:.8rem;padding:.5rem .8rem}
.btn-row{display:flex;flex-wrap:wrap;gap:.65rem;align-items:center;margin-top:1.3rem}
:focus-visible{outline:2px solid var(--magenta);outline-offset:2px}

/* ── due panel ── */
.duepanel{
  border:1px solid var(--rule);border-left:3px solid var(--ember);background:var(--paper-raised);
  border-radius:3px;padding:1.15rem 1.25rem 1.25rem;margin:1.6rem 0 0;box-shadow:var(--shadow);
}
.duepanel h3{margin-top:0}
.duelist{list-style:none;margin:0;padding:0}
.duelist li{display:flex;align-items:baseline;gap:.7rem;padding:.55rem 0;border-top:1px solid var(--rule)}
.duelist li:first-child{border-top:0}
.duelist .dl-name{display:block;flex:1 1 auto;font-family:var(--display);font-size:1.05rem}
.duelist .dl-name small{display:block;font-family:var(--ui);font-weight:400;font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);margin-top:.1rem}
.duelist .dl-when{display:block;flex:0 0 auto;font-family:var(--ui);font-size:.79rem;color:var(--ink-soft);text-align:right}
.tag{
  display:inline-block;font-family:var(--ui);font-size:.68rem;font-weight:600;
  letter-spacing:.07em;text-transform:uppercase;padding:.16rem .42rem;border-radius:2px;
}
.tag-over{background:var(--apple-wash);color:var(--apple-deep)}
.tag-now{background:var(--ember-wash);color:var(--ember-deep)}
.tag-new{background:var(--paper-sunk);color:var(--ink-soft)}
.tag-continue{background:var(--green-wash);color:var(--green)}
.empty-note{color:var(--ink-faint);font-size:.95rem;margin:0}

/* ── section cards ── */
.seclist{list-style:none;margin:.4rem 0 0;padding:0}
.seccard{
  width:100%;text-align:left;background:var(--paper-raised);border:1px solid var(--rule);
  border-radius:3px;padding:.95rem 1.05rem;margin-bottom:.6rem;cursor:pointer;font:inherit;color:inherit;
  display:flex;gap:.9rem;align-items:baseline;transition:border-color .15s,background .15s;
}
.seccard:hover{border-color:var(--magenta);background:var(--paper-raised)}
.seccard .sc-id{
  display:block;font-family:var(--ui);font-size:.7rem;font-weight:600;letter-spacing:.1em;color:var(--magenta);
  flex:0 0 1.1rem;padding-top:.18rem;
}
.seccard .sc-body{display:block;flex:1 1 auto;min-width:0}
.seccard .sc-title{display:block;font-family:var(--display);font-size:1.1rem;line-height:1.3}
.seccard .sc-sub{display:block;font-family:var(--ui);font-size:.73rem;letter-spacing:.045em;text-transform:uppercase;color:var(--ink-faint);margin-top:.12rem;line-height:1.45}
.seccard .sc-state{display:block;font-family:var(--ui);font-size:.79rem;color:var(--ink-soft);margin-top:.5rem}
.seccard .sc-state .dot{color:var(--rule);margin:0 .4rem}

/* ── recall gate ── */
.recall-frame{border-left:2px solid var(--magenta);background:var(--paper-raised);padding:1.1rem 1.2rem;margin:1.4rem 0}
.recall-frame p:last-child{margin-bottom:0}
textarea{
  width:100%;min-height:9.5rem;font-family:var(--body);font-size:1.02rem;line-height:1.6;
  color:var(--ink);background:var(--paper-raised);border:1px solid var(--rule);border-radius:2px;
  padding:.85rem .95rem;resize:vertical;
}
textarea:focus{border-color:var(--magenta);outline:none;box-shadow:0 0 0 3px var(--magenta-wash)}
textarea.sm{min-height:6.5rem}
.model{border:1px solid var(--rule);border-left:2px solid var(--ember);background:var(--paper-raised);padding:1rem 1.15rem;margin-top:1.2rem}
.model h3{margin:0 0 .5rem}
.model p{margin:0;color:var(--ink-soft)}
.skipnote{font-family:var(--ui);font-size:.79rem;color:var(--ink-faint);margin-top:1.4rem}
.skipnote button{
  font:inherit;background:none;border:0;border-bottom:1px solid var(--rule);
  color:var(--ink-faint);cursor:pointer;padding:0 0 1px;
}
.skipnote button:hover{color:var(--apple-deep);border-color:var(--apple)}

/* ── question ── */
.qmeta{font-family:var(--ui);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin:1.9rem 0 .55rem}
.qmeta .applied{color:var(--magenta-deep)}
.qmeta .esc{color:var(--ember-deep)}
.qstem{font-family:var(--display);font-weight:400;font-size:1.22rem;line-height:1.42;margin:0 0 1.25rem}
.opts{list-style:none;margin:0;padding:0}
.opt{
  width:100%;text-align:left;font:inherit;color:inherit;
  background:var(--paper-raised);border:1px solid var(--rule);border-radius:3px;
  padding:.8rem .95rem;margin-bottom:.55rem;cursor:pointer;
  display:flex;gap:.75rem;align-items:flex-start;line-height:1.5;
  transition:border-color .13s,background .13s;
}
.opt:hover:not(:disabled){border-color:var(--magenta)}
.opt:disabled{cursor:default}
.opt .mk{
  flex:0 0 1.35rem;height:1.35rem;border-radius:50%;border:1px solid var(--rule);
  font-family:var(--ui);font-size:.72rem;font-weight:600;color:var(--ink-faint);
  display:flex;align-items:center;justify-content:center;margin-top:.12rem;
}
.opt.sel{border-color:var(--ink);background:var(--paper-raised)}
.opt.sel .mk{border-color:var(--ink);background:var(--ink);color:var(--paper-raised)}
.opt.right{border-color:var(--green);background:var(--green-wash)}
.opt.right .mk{border-color:var(--green);background:var(--green);color:var(--paper-raised)}
.opt.wrong{border-color:var(--apple);background:var(--apple-wash)}
.opt.wrong .mk{border-color:var(--apple);background:var(--apple);color:var(--paper-raised)}

/* ── confidence ── */
.conf{margin-top:1.35rem;border-top:1px solid var(--rule);padding-top:1.15rem}
.conf p{font-family:var(--ui);font-size:.8rem;letter-spacing:.03em;color:var(--ink-soft);margin:0 0 .6rem}
.conf .btn{min-width:7rem}

/* ── reveal ── */
.reveal{margin-top:1.5rem;border-top:1px solid var(--rule);padding-top:1.25rem}
.verdict{font-family:var(--ui);font-size:.76rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin:0 0 .7rem}
.verdict.ok{color:var(--green)}
.verdict.no{color:var(--apple-deep)}
.verdict small{font-weight:400;letter-spacing:.05em;text-transform:none;color:var(--ink-faint);margin-left:.5rem;font-size:.78rem}
.explain{color:var(--ink-soft);margin:0}
.explain + .explain{margin-top:.9rem}
.kwline{font-family:var(--ui);font-size:.78rem;color:var(--ink-faint);margin:.7rem 0 0}
.kwline b{color:var(--ink-soft);font-weight:600}

/* ── results ── */
.statgrid{display:flex;flex-wrap:wrap;gap:.6rem;margin:1.3rem 0 .4rem}
.stat{flex:1 1 8rem;border:1px solid var(--rule);background:var(--paper-raised);border-radius:3px;padding:.85rem .95rem}
.stat .sv{font-family:var(--display);font-size:1.8rem;font-weight:400;line-height:1.1}
.stat .sl{font-family:var(--ui);font-size:.71rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin-top:.25rem}
.stat.apple .sv{color:var(--apple-deep)}
.stat.magenta .sv{color:var(--magenta)}
.calib{border:1px solid var(--rule);border-left:2px solid var(--magenta);background:var(--paper-raised);padding:1rem 1.15rem;margin-top:1.2rem}
.calib h3{margin:0 0 .6rem}
.calib table{width:100%;border-collapse:collapse;font-family:var(--ui);font-size:.86rem}
.calib td{padding:.35rem 0;border-top:1px solid var(--rule)}
.calib tr:first-child td{border-top:0}
.calib td:last-child{text-align:right;font-weight:600}
.calib .note{font-family:var(--body);font-size:.96rem;color:var(--ink-soft);margin:.85rem 0 0}
.nextdue{font-family:var(--ui);font-size:.86rem;color:var(--ink-soft);margin-top:1.3rem;padding-top:1rem;border-top:1px solid var(--rule)}
.nextdue b{color:var(--ink);font-weight:600}
.missedlist{list-style:none;margin:0;padding:0}
.missedlist li{padding:.5rem 0;border-top:1px solid var(--rule)}
.missedlist .ml-sec{display:block;font-family:var(--ui);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)}
.missedlist .ml-stem{display:block;color:var(--ink-soft)}

/* ── footnote / utility ── */
.footnote{font-family:var(--ui);font-size:.75rem;color:var(--ink-faint);margin-top:3rem;padding-top:1.2rem;border-top:1px solid var(--rule);line-height:1.7}
.linklike{font-family:var(--ui);font-size:.75rem;color:var(--ink-faint);background:none;border:0;padding:0;text-decoration:underline;cursor:pointer}
.linklike:hover{color:var(--apple-deep)}
.hidden{display:none !important}

/* ── Today panel, read/lock states, and the ?today= QA banner ── */
.testdate{
  font-family:var(--ui);font-size:.76rem;font-weight:600;letter-spacing:.02em;line-height:1.4;
  background:var(--ember-wash);color:var(--ember-deep);border-bottom:1px solid var(--ember);
  padding:.45rem 1.35rem;text-align:center;
}
.testdate.bad{background:var(--apple-wash);color:var(--apple-deep);border-color:var(--apple)}
.today .tgroup{border-top:1px solid var(--rule);padding:.7rem 0 .2rem}
.today .tgroup:first-of-type{border-top:0;padding-top:0}
.today h4{font-family:var(--ui);font-weight:600;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 .35rem}
.today .empty-note{font-size:.95rem;margin:0 0 .45rem}
.today .duelist li{padding:0;border-top:0}
.todayrow,.todayrow-static{
  width:100%;display:flex;align-items:baseline;gap:.7rem;text-align:left;font:inherit;color:inherit;
  background:none;border:0;border-top:1px solid var(--rule);padding:.5rem 0;
}
.today .duelist li:first-child .todayrow,.today .duelist li.todayrow-static:first-child{border-top:0}
.todayrow{cursor:pointer}
.todayrow:hover .dl-name{color:var(--magenta-deep)}
.dl-sub{display:block;font-family:var(--ui);font-size:.7rem;color:var(--ink-faint);margin-top:.15rem;text-align:right}
.tfoot{font-family:var(--ui);font-size:.75rem;color:var(--ink-faint);margin:.5rem 0 0;padding-top:.5rem;border-top:1px solid var(--rule)}
.tag-locked{background:var(--paper-sunk);color:var(--ink-soft)}
.secitem{margin-bottom:.6rem}
.secitem .seccard{margin-bottom:0}
.seccard.locked{cursor:default;opacity:.72}
.seccard.locked:hover{border-color:var(--rule)}
.markread{margin:.4rem 0 0 2.15rem}

@media (max-width:520px){
  body{font-size:16px}
  h1{font-size:1.78rem}
  .qstem{font-size:1.12rem}
  .topbar .tb-meta{font-size:.7rem}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important}
}
</style>
</head>
<body>
<div class="topbar" id="topbar">
  <div class="wrap">
    <button class="tb-back hidden" id="tbBack">&larr; Home</button>
    <div class="tb-title" id="tbTitle">Perfect Love, Imperfect Relationships</div>
    <div class="tb-meta" id="tbMeta"></div>
  </div>
  <div class="progressline"><span id="tbProgress" style="width:0%"></span></div>
</div>
<main class="wrap" id="app"></main>
<script>
// Section metadata: id, title, subtitle (source), recall prompt, model answer for self-scoring
const SECTIONS = [
  {
    id: "A",
    title: "The Mood of Unlove",
    subtitle: "Introduction",
    recallPrompt: "Write what you can recall about: Welwood’s definition of love (its essence and its expression), the mood of unlove, and how dissociation produces the wound of the heart.",
    modelAnswer: "Love is a blend of openness and warmth: openness, the heart’s unconditional yes, is its essence (the cloudless sky); warmth, the impulse to reach out and connect, is its expression (sunlight through that sky). The mood of unlove is a deep-seated suspicion that we are not lovable just as we are. Not feeling embraced as children, we dissociate — turn away from our pain, our need for love, and the body — which constricts the vital center in the belly and the heart center. Not knowing we’re loved, numbing the heart, and so shutting the pathways love flows through: that whole pattern is the wound of the heart."
  },
  {
    id: "B",
    title: "To Feel Held in Love",
    subtitle: "Prologue",
    recallPrompt: "Write what you can recall about: David’s session and where his inquiry finally landed, Winnicott’s holding environment, and the two aspects of holding with the two fears that follow when either is missing.",
    modelAnswer: "David kept leaving promising relationships; his mother had been erratic and unavailable, so he didn’t trust love. Asked repeatedly what each wish would give him, he moved from trust, to acceptance, to connection, to belonging, to feeling held — and landed in warmth in his chest, fullness in his belly, and “nothing to prove, I can just be.” Winnicott called the family a holding environment. Holding has two aspects, contact and space, like cradling a fallen bird. Too little space (intrusion) breeds fear of engulfment and withdrawal; too little contact breeds fear of abandonment and clinging. Contact and space correspond to love’s warmth and openness."
  },
  {
    id: "C",
    title: "Absolute & Relative Love",
    subtitle: "Chapter 1 — Perfect Love, Imperfect Relationships",
    recallPrompt: "Write what you can recall about: absolute versus relative love, how the wound forms in childhood (and what the grievance “scab” is), and what Anna discovered about approval.",
    modelAnswer: "Absolute love is unconditional openness that comes through us from beyond the personality; meeting being-to-being is like water poured into water. Relative love is that sunlight filtered through the clouds of conditioning — person-to-person, dependent on time and circumstance, inevitably waxing and waning. Infants take their mother as the very source of love; when love proves conditional they conclude “I am not truly loved,” a narcissistic injury over which grievance forms as a psychic scab. Anna, who chased approval, found that what she actually felt when she won it was her own heart opening — what she wanted was her own heart, not the other’s verdict."
  },
  {
    id: "D",
    title: "The Mood of Grievance",
    subtitle: "Chapter 2",
    recallPrompt: "Write what you can recall about: how grievance works (the sentry and its alarms), how the bad-other image forms and gets projected, and the payoffs people get from holding on.",
    modelAnswer: "Grievance is the urge to make others bad or wrong and then judge, reject, or punish them. Rooted in old hurt about not being loved, it sits in us like a dormant virus, guarded by a sentry scanning for threats. Because a young child must keep the parent good, the frustrating parent falls into unconsciousness and grows into a generalized bad other — the Most Wanted poster we then project onto partners over trivial triggers. When asked, no student would let their grievance go. The payoffs they named: power and protection, righteousness, identity, sympathy, self-soothing, family bonding, a worldview, a tie to a lost parent, and escape from responsibility."
  },
  {
    id: "E",
    title: "Letting Grievance Go",
    subtitle: "Chapter 3",
    recallPrompt: "Write what you can recall about: the four steps of unconditional presence as Jane moved through them, what owning her hatred released, and kind understanding and not taking it personally.",
    modelAnswer: "The medicine lies within the poison: what we fail to grieve turns into grievance. Unconditional presence has four steps. Acknowledging recognizes a feeling as it is. Allowing gives it room, neither identifying with it nor rejecting it. Opening drops the barrier against it. Entering moves awareness into its center. Jane’s sense of feeling unloved became sweetness. Owning her hatred rather than freezing gave her solidity and clarity, and Tom faded from focus. Kind understanding feels for the parents’ own woundedness without excusing or condemning them. Not taking it personally treats hurtful people like empty boats, driven by their own wounds."
  },
  {
    id: "F",
    title: "From Self-Hatred to Self-Love",

/* ===================================================================
   Perfect Love, Imperfect Relationships — self-quiz engine
   =================================================================== */

const ALL_QUESTIONS = [].concat(
  QUESTIONS_A, QUESTIONS_B, QUESTIONS_C, QUESTIONS_D,
  QUESTIONS_E, QUESTIONS_F, QUESTIONS_G, QUESTIONS_H
);
const QBY_ID = {};
ALL_QUESTIONS.forEach(q => { QBY_ID[q.id] = q; });
const SEC_BY_ID = {};
SECTIONS.forEach(s => { SEC_BY_ID[s.id] = s; });

/* ===================================================================
   ENGINE CONFIGURATION — engine v2 (delayed first quiz). Tune here.
   =================================================================== */
/* Review intervals in days. The first scored run lands on index FIRST_RUN_INDEX. */
const INTERVALS = [3, 7, 30, 91, 182];
const FIRST_RUN_INDEX = 0;
const PASS_THRESHOLD = 0.80;
/* Steps taken through INTERVALS on a later scored run: up on a pass, down on a fail (floor 0). */
const PASS_STEP = 1;
const FAIL_STEP = 1;
/* After "Mark section read", the section's quiz opens this many local days later. */
const UNLOCK_DELAY_DAYS = 1;
/* true: a section's first scored run requires "Mark section read" first. */
const REQUIRE_READ_FIRST = true;
const MIXED_RUN_SIZE = 12;
const STORAGE_KEY = "plir:state";
const STATE_VERSION = 2;
/* Engine-v1 intervals, used only to migrate version-1 saved state on boot. */
const LEGACY_INTERVALS_V1 = [7, 30, 91, 182];
const BOOK_TITLE = "Perfect Love, Imperfect Relationships";

function intervalLabel(days) {
  if (days % 182 === 0) return plural(days / 182 * 6, "month", "months");
  if (days % 91 === 0) return plural(days / 91 * 3, "month", "months");
  if (days % 30 === 0) return plural(days / 30, "month", "months");
  if (days % 7 === 0) return plural(days / 7, "week", "weeks");
  return plural(days, "day", "days");
}

/* ===================================================================
   Storage — localStorage with in-memory fallback
   =================================================================== */
const Store = (() => {
  let memory = null;
  let usingFallback = false;

  async function load() {
    try {
      const raw = window.localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
      return null;
    } catch (e) {
      usingFallback = true;
      return memory ? JSON.parse(memory) : null;
    }
  }

  async function save(state) {
    const payload = JSON.stringify(state);
    memory = payload;
    try {
      window.localStorage.setItem(STORAGE_KEY, payload);
    } catch (e) {
      usingFallback = true;
    }
  }

  return { load, save, isFallback: () => usingFallback };
})();

function blankState() {
  return { version: STATE_VERSION, sections: {}, items: {}, missed: [], confidence: [], runs: {} };
}

let STATE = blankState();

function sectionState(id) {
  if (!STATE.sections[id]) {
    STATE.sections[id] = { attempts: [], intervalIdx: -1, dueDate: null, recallOnlyAt: null };
  }
  return STATE.sections[id];
}
function itemState(id) {
  if (!STATE.items[id]) STATE.items[id] = { correctOnce: false, escalatedCorrect: false };
  return STATE.items[id];
}

/* ===================================================================
   Dates — stored as local YYYY-MM-DD, compared at local midnight.
   QA hook: ?today=YYYY-MM-DD replaces the local date everywhere (for simulating days in testing).
   =================================================================== */
function parseISO(s) {
  const p = String(s).split("-").map(Number);
  const d = new Date(p[0], (p[1] || 1) - 1, p[2] || 1);
  d.setHours(0, 0, 0, 0);
  return d;
}
/* Built from local components — toISOString() would roll back a day west of UTC. */
function iso(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return y + "-" + m + "-" + day;
}
const DATE_OVERRIDE = (() => {
  let raw = null;
  try { raw = new URLSearchParams(window.location.search).get("today"); } catch (e) { raw = null; }
  if (raw === null) return { active: false };
  const ok = /^\d{4}-\d{2}-\d{2}$/.test(raw) && iso(parseISO(raw)) === raw;   // rejects 2026-02-30 etc.
  return ok ? { active: true, iso: raw } : { active: false, invalid: raw };
})();
function today() {
  if (DATE_OVERRIDE.active) return parseISO(DATE_OVERRIDE.iso);
  const d = new Date(); d.setHours(0, 0, 0, 0); return d;
}
function addDays(date, n) { const d = new Date(date); d.setDate(d.getDate() + n); return d; }
function daysBetween(a, b) { return Math.round((b - a) / 86400000); }
function fmtDate(s) {
  const d = parseISO(s);
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
}
function fmtDay(s) {
  const d = parseISO(s);
  return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
}
function relDue(dueISO) {
  const n = daysBetween(today(), parseISO(dueISO));   // negative = overdue
  if (n < 0) return { kind: "over", key: n, days: -n, text: "overdue by " + plural(-n, "day", "days") };
  if (n === 0) return { kind: "now", key: 0, days: 0, text: "due today" };
  if (n === 1) return { kind: "soon", key: 1, days: 1, text: "due tomorrow" };
  return { kind: "soon", key: n, days: n, text: "next due " + fmtDate(dueISO) };
}

/* ===================================================================
   Scheduling — first scored run lands on FIRST_RUN_INDEX; afterwards a
   pass steps up PASS_STEP, a fail steps down FAIL_STEP (floor 0).
   =================================================================== */
function recordSectionAttempt(sectionId, accuracy, mode, n) {
  const st = sectionState(sectionId);
  const prevIdx = st.intervalIdx;
  st.attempts.push({ d: iso(today()), acc: Math.round(accuracy * 1000) / 1000, mode: mode, n: n });
  if (prevIdx < 0) {
    st.intervalIdx = Math.min(FIRST_RUN_INDEX, INTERVALS.length - 1);
  } else if (accuracy >= PASS_THRESHOLD) {
    st.intervalIdx = Math.min(prevIdx + PASS_STEP, INTERVALS.length - 1);
  } else {
    st.intervalIdx = Math.max(prevIdx - FAIL_STEP, 0);
  }
  st.dueDate = iso(addDays(today(), INTERVALS[st.intervalIdx]));
  return { st: st, prevIdx: prevIdx };
}

/* Read/lock state for a section that has no scored run yet.
   unread → locked (read today, opens tomorrow) → open (first run available). */
function readState(id) {
  const st = STATE.sections[id];
  if (st && st.attempts.length > 0) return { kind: "scored" };
  const readAt = st && st.recallOnlyAt;
  if (STATE.runs[id]) return { kind: "open", readAt: readAt || null };   // first run already under way
  if (!readAt) return REQUIRE_READ_FIRST ? { kind: "unread" } : { kind: "open" };
  const opens = iso(addDays(parseISO(readAt), UNLOCK_DELAY_DAYS));
  if (daysBetween(today(), parseISO(opens)) > 0) return { kind: "locked", readAt: readAt, opens: opens };
  return { kind: "open", readAt: readAt };
}

function markSectionRead(id) {
  const st = sectionState(id);
  st.recallOnlyAt = iso(today());
  Store.save(STATE);
}

function sectionStatus(id) {
  const st = STATE.sections[id];
  if (!st || st.attempts.length === 0) return { kind: "new", label: "not yet begun" };
  const r = relDue(st.dueDate);
  return { kind: r.kind, label: r.text, due: st.dueDate, attempts: st.attempts.length };
}

function dueSections() {
  return SECTIONS
    .filter(s => STATE.sections[s.id] && STATE.sections[s.id].attempts.length > 0)
    .map(s => ({ sec: s, rel: relDue(STATE.sections[s.id].dueDate) }))
    .sort((a, b) => a.rel.key - b.rel.key);
}

function anyFirstPassDone() {
  return SECTIONS.some(s => STATE.sections[s.id] && STATE.sections[s.id].attempts.length > 0);
}

/* ===================================================================
   Question selection
   =================================================================== */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* An item comes back harder if it was answered correctly on a prior visit. */
function variantFor(q) {
  const st = STATE.items[q.id];
  if (st && st.correctOnce && q.escalated) return "escalated";
  return "base";
}

function buildRun(mode, sectionId) {
  let pool;
  if (mode === "section") {
    pool = shuffle(ALL_QUESTIONS.filter(q => q.section === sectionId));
  } else {
    const missedQs = shuffle(STATE.missed.map(id => QBY_ID[id]).filter(Boolean))
      .slice(0, Math.min(4, Math.ceil(MIXED_RUN_SIZE / 3)));
    const missedIds = new Set(missedQs.map(q => q.id));
    const rest = shuffle(ALL_QUESTIONS.filter(q => !missedIds.has(q.id)));
    pool = shuffle(missedQs.concat(rest).slice(0, MIXED_RUN_SIZE));
  }
  return pool.map(q => {
    const variant = variantFor(q);
    const isEsc = variant === "escalated";
    const escv = q.escalated || {};
    const type = isEsc ? (escv.type === "short" ? "short" : "mc") : "mc";
    let stem, options, correct, explanation;
    if (isEsc && type === "short") {
      stem = escv.prompt;
      options = null; correct = null;
      explanation = escv.sampleAnswer;
    } else if (isEsc) {
      stem = escv.stem || q.stem;
      options = escv.options; correct = escv.correct;
      explanation = escv.explanation;
    } else {
      stem = q.stem; options = q.options; correct = q.correct;
      explanation = q.explanation;
    }
    let order = null, correctIdx = null;
    if (options) {
      order = shuffle(options.map((_, i) => i));           // options shuffled every load
      correctIdx = order.indexOf(correct);
    }
    return {
      q: q, variant: variant, type: type,
      stem: stem, options: options, order: order, correctIdx: correctIdx,
      explanation: explanation,
      keywords: isEsc && type === "short" ? (escv.keywords || []) : [],
      minKeywords: isEsc && type === "short" ? (escv.minKeywords || 1) : 1
    };
  });
}

/* ===================================================================
   Run state
   =================================================================== */
let RUN = null;

function freshRunFields() {
  return {
    selected: null, confidence: null, revealed: false,
    shortText: "", shortHits: 0, shortReady: false, recallText: ""
  };
}

function startRun(mode, sectionId) {
  const items = buildRun(mode, sectionId);
  RUN = Object.assign({ mode: mode, sectionId: sectionId, items: items, idx: 0, results: [] }, freshRunFields());
  saveProgressSnapshot();
  Store.save(STATE);
}

function runKey(mode, sectionId) { return mode === "section" ? sectionId : "__mixed__"; }

/* Snapshot the in-progress run so it can be resumed later — keyed per
   section (and separately for mixed review), so switching between
   sections freely keeps each one's place. Cleared once that run finishes. */
function saveProgressSnapshot() {
  if (!RUN) return;
  const key = runKey(RUN.mode, RUN.sectionId);
  if (RUN.idx >= RUN.items.length) { delete STATE.runs[key]; return; }
  STATE.runs[key] = {
    mode: RUN.mode, sectionId: RUN.sectionId,
    items: RUN.items, idx: RUN.idx, results: RUN.results
  };
}

function resumeRun(key) {
  const snap = STATE.runs[key];
  if (!snap) return;
  /* A snapshot taken on reveal (before advance) holds a result for the
     pending question; trim so it is re-served, not counted twice. */
  const results = (snap.results || []).slice(0, snap.idx);
  RUN = Object.assign({
    mode: snap.mode, sectionId: snap.sectionId, items: snap.items, idx: snap.idx, results: results
  }, freshRunFields());
  renderQuestion();
}

function runAccuracy() {
  if (!RUN || RUN.results.length === 0) return null;
  const c = RUN.results.filter(r => r.correct).length;
  return c / RUN.results.length;
}

/* ===================================================================
   Rendering helpers
   =================================================================== */
const app = document.getElementById("app");
const tbBack = document.getElementById("tbBack");
const tbTitle = document.getElementById("tbTitle");
const tbMeta = document.getElementById("tbMeta");
const tbProgress = document.getElementById("tbProgress");

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

function plural(n, one, many) { return n + " " + (n === 1 ? one : many); }

function setBar(opts) {
  tbBack.classList.toggle("hidden", !opts.back);
  tbTitle.textContent = opts.title || BOOK_TITLE;
  if (opts.metaMain) {
    tbMeta.innerHTML = "<b>" + esc(opts.metaMain) + "</b>" + (opts.metaSub ? esc(opts.metaSub) : "");
  } else {
    tbMeta.textContent = "";
  }
  tbProgress.style.width = (opts.progress || 0) + "%";
}

function shelfrule() { return '<div class="shelfrule" aria-hidden="true"><i></i></div>'; }

function startOrResume(id) {
  if (STATE.runs[id]) { resumeRun(id); return; }
  const rs = readState(id);
  if (rs.kind === "unread") { renderReadGate(id); return; }
  if (rs.kind === "locked") { renderHome(); return; }
  startRun("section", id); renderRecall();
}

function todayRow(sec, whenHtml, action) {
  const inner = '<span class="dl-name">' + esc(sec.title) + "<small>" + esc(sec.subtitle) + "</small></span>" +
    '<span class="dl-when">' + whenHtml + "</span>";
  return action
    ? '<li><button class="todayrow" data-today="' + sec.id + '">' + inner + "</button></li>"
    : '<li class="todayrow-static">' + inner + "</li>";
}

function renderTodayPanel() {
  const due = dueSections();
  const pressing = due.filter(d => d.rel.kind === "over" || d.rel.kind === "now");
  const upcoming = due.filter(d => d.rel.kind === "soon");
  const ready = SECTIONS.filter(s => readState(s.id).kind === "open");
  const locked = SECTIONS.map(s => ({ sec: s, rs: readState(s.id) })).filter(x => x.rs.kind === "locked");
  const unread = SECTIONS.filter(s => readState(s.id).kind === "unread");
  const mixedOn = anyFirstPassDone();

  let h = '<div class="duepanel today" id="todayPanel"><h3>Today · ' + esc(fmtDay(iso(today()))) + "</h3>";

  h += '<div class="tgroup" data-group="due"><h4>Due for review</h4>';
  if (pressing.length) {
    h += '<ul class="duelist">';
    pressing.forEach(d => {
      const cls = d.rel.kind === "over" ? "tag-over" : "tag-now";
      h += todayRow(d.sec, '<span class="tag ' + cls + '">' + esc(d.rel.text) + "</span>", true);
    });
    h += "</ul>";
  } else h += '<p class="empty-note">Nothing due today.</p>';
  h += "</div>";

  h += '<div class="tgroup" data-group="ready"><h4>Ready for first run</h4>';
  if (ready.length) {
    h += '<ul class="duelist">';
    ready.forEach(s => {
      const rs = readState(s.id);
      h += todayRow(s, '<span class="tag tag-continue">' + (STATE.runs[s.id] ? "continue" : "open") + "</span>" +
        (rs.readAt ? '<small class="dl-sub">read ' + esc(fmtDay(rs.readAt)) + "</small>" : ""), true);
    });
    h += "</ul>";
  } else h += '<p class="empty-note">' + (REQUIRE_READ_FIRST ? "None. A section opens the day after you mark it read." : "None.") + "</p>";
  h += "</div>";

  h += '<div class="tgroup" data-group="locked"><h4>Locked</h4>';
  if (locked.length) {
    h += '<ul class="duelist">';
    locked.forEach(x => {
      h += todayRow(x.sec, '<span class="tag tag-locked">Quiz opens ' + esc(fmtDay(x.rs.opens)) + "</span>", false);
    });
    h += "</ul>";
  } else h += '<p class="empty-note">No sections locked.</p>';
  h += "</div>";

  h += '<div class="tgroup" data-group="mixed"><h4>Mixed review</h4>' +
    '<p class="empty-note" id="mixedStatus">' + (mixedOn
      ? "Available — draws " + MIXED_RUN_SIZE + " questions across every section."
      : "Not yet — opens after any section’s first scored run.") + "</p></div>";

  if (upcoming.length) {
    h += '<div class="tgroup" data-group="upcoming"><h4>Coming up</h4><ul class="duelist">';
    upcoming.forEach(d => { h += todayRow(d.sec, esc(d.rel.text), false); });
    h += "</ul></div>";
  }
  if (REQUIRE_READ_FIRST && unread.length) {
    h += '<p class="tfoot">' + plural(unread.length, "section", "sections") + " not yet read.</p>";
  }
  return h + "</div>";
}

/* ===================================================================
   Screen: Home
   =================================================================== */
function renderHome(state) {
  RUN = null;
  /* renderHome is also used directly as a click handler, so `state` may be an
     Event — only the exact string arms the confirm. */
  const confirmingReset = state === "confirmReset";
  setBar({ back: false, progress: 0 });
  const started = anyFirstPassDone();

  let secList = '<ul class="seclist">';
  SECTIONS.forEach(s => {
    const st = sectionStatus(s.id);
    const rs = readState(s.id);
    const n = ALL_QUESTIONS.filter(q => q.section === s.id).length;
    const inProg = STATE.runs[s.id];
    let stateLine = "";
    let disabled = false;
    let markBtn = "";
    if (inProg) {
      stateLine = '<span class="tag tag-continue">continue</span>' +
        '<span class="dot">·</span>question ' + (inProg.idx + 1) + " of " + inProg.items.length;
    } else if (rs.kind === "unread") {
      stateLine = '<span class="tag tag-new">not yet read</span>';
      markBtn = '<button class="btn btn-quiet btn-sm markread" data-read="' + s.id + '">Mark section read</button>';
    } else if (rs.kind === "locked") {
      disabled = true;
      stateLine = '<span class="tag tag-locked">locked</span><span class="dot">·</span>Quiz opens ' + esc(fmtDay(rs.opens));
    } else if (rs.kind === "open") {
      stateLine = '<span class="tag tag-continue">first run open</span>' +
        (rs.readAt ? '<span class="dot">·</span>read ' + esc(fmtDay(rs.readAt)) : "");
    } else {
      const tagCls = st.kind === "over" ? "tag-over" : (st.kind === "now" ? "tag-now" : "");
      stateLine = (st.kind === "over" || st.kind === "now")
        ? '<span class="tag ' + tagCls + '">' + esc(st.label) + "</span>"
        : esc(st.label);
      stateLine += '<span class="dot">·</span>' + plural(st.attempts, "pass", "passes");
    }
    secList += '<li class="secitem"><button class="seccard' + (disabled ? " locked" : "") + '" data-sec="' + s.id + '"' +
      (disabled ? " disabled" : "") + ">" +
      '<span class="sc-id">' + s.id + "</span>" +
      '<span class="sc-body"><span class="sc-title">' + esc(s.title) + "</span>" +
      '<span class="sc-sub">' + esc(s.subtitle) + " · " + plural(n, "question", "questions") + "</span>" +
      '<span class="sc-state">' + stateLine + "</span></span></button>" + markBtn + "</li>";
  });
  secList += "</ul>";

  const missedCount = STATE.missed.length;
  const mixedSnap = STATE.runs.__mixed__;

  app.innerHTML =
    '<p class="subtitle">John Welwood · Trumpeter, 2006</p>' +
    "<h1>Perfect Love,<br><em>Imperfect Relationships</em></h1>" +
    '<p class="byline"><span class="sc">Healing the Wound of the Heart</span> — a self-quiz in ' +
      SECTIONS.length + " sections, " + ALL_QUESTIONS.length + " questions.</p>" +
    renderTodayPanel() +
    (started
      ? "<h3>Mixed review</h3>" +
        '<p class="lede">Draws ' + MIXED_RUN_SIZE + " questions at random across the whole book" +
          (missedCount ? ", weighted toward the " + plural(missedCount, "question", "questions") + " you’ve missed" : "") +
          ". Interleaving forces discrimination between neighbouring distinctions rather than letting each section be answered from short-term context.</p>" +
        '<div class="btn-row"><button class="btn" id="startMixed">' +
          (mixedSnap ? "Continue mixed review — question " + (mixedSnap.idx + 1) + " of " + mixedSnap.items.length : "Begin mixed review") +
        "</button></div>" +
        "<h3>By section</h3>"
      : "<h3>Sections</h3>" +
        '<p class="lede">Read a section in the book, then mark it read here: that runs the free-recall prompt only and opens the section’s quiz the next day. Mixed review unlocks after a first scored run.</p>') +
    secList +
    shelfrule() +
    '<p class="footnote">Marking a section read runs its free-recall prompt and locks its questions until the next day. ' +
      "Every answer is preceded by a confidence tap, and the calibration readout at the end of each run shows accuracy when sure against accuracy when unsure. " +
      "Reviews start " + intervalLabel(INTERVALS[FIRST_RUN_INDEX]) + " after the first scored run; a pass steps the interval up, a miss steps it back. " +
      "Progress is stored on this device" +
      (Store.isFallback() ? " (in memory only for this session — persistent storage is unavailable here)" : "") +
      ".</p>" +
    (confirmingReset
      ? '<p class="footnote">This clears every section’s history, read dates, due dates, and the missed-question pool. It can’t be undone. ' +
        '<button class="linklike" id="resetYes">Reset everything</button> &nbsp;·&nbsp; ' +
        '<button class="linklike" id="resetNo">Cancel</button></p>'
      : '<p class="footnote"><button class="linklike" id="resetAll">Reset all progress</button></p>');

  const mixBtn = document.getElementById("startMixed");
  if (mixBtn) mixBtn.addEventListener("click", () => {
    if (STATE.runs.__mixed__) { resumeRun("__mixed__"); }
    else { startRun("mixed", null); renderRecall(); }
  });
  Array.from(document.querySelectorAll("[data-sec]")).forEach(btn => {
    btn.addEventListener("click", () => startOrResume(btn.getAttribute("data-sec")));
  });
  Array.from(document.querySelectorAll("[data-today]")).forEach(btn => {
    btn.addEventListener("click", () => startOrResume(btn.getAttribute("data-today")));
  });
  Array.from(document.querySelectorAll("[data-read]")).forEach(btn => {
    btn.addEventListener("click", () => renderReadGate(btn.getAttribute("data-read")));
  });
  /* Inline two-click confirm — native confirm() is blocked without notice in
     sandboxed frames, which would make this control silently do nothing. */
  const resetBtn = document.getElementById("resetAll");
  if (resetBtn) resetBtn.addEventListener("click", () => renderHome("confirmReset"));
  const resetYes = document.getElementById("resetYes");
  if (resetYes) resetYes.addEventListener("click", () => {
    STATE = blankState();
    Store.save(STATE);
    renderHome();
  });
  const resetNo = document.getElementById("resetNo");
  if (resetNo) resetNo.addEventListener("click", () => renderHome());
  window.scrollTo(0, 0);
}

/* ===================================================================
   Screen: mark section read — free-recall gate only, then lock
   =================================================================== */
let READ_DRAFT = { id: null, text: "" };

function renderReadGate(id, state) {
  const sec = SEC_BY_ID[id];
  if (READ_DRAFT.id !== id) READ_DRAFT = { id: id, text: "" };
  const revealed = state === "revealed";
  const confirmingSkip = state === "confirmSkip";
  const opens = iso(addDays(today(), UNLOCK_DELAY_DAYS));
  setBar({ back: true, title: sec.title, metaMain: "Read", metaSub: "recall only", progress: 0 });

  app.innerHTML =
    '<p class="qmeta">Mark section read · free recall only</p>' +
    '<h2 style="margin-top:.2rem">' + esc(sec.title) + "</h2>" +
    '<p class="lede">No questions today. Recording this section as read locks its quiz until ' + esc(fmtDay(opens)) + ".</p>" +
    '<div class="recall-frame"><p>' + esc(sec.recallPrompt) + "</p></div>" +
    '<textarea id="readBox" placeholder="Write what you can, from memory. Nothing here is graded — the effort of retrieval is the point.">' +
      esc(READ_DRAFT.text) + "</textarea>" +
    (revealed
      ? '<div class="model"><h3>For comparison</h3><p>' + esc(sec.modelAnswer) + "</p></div>" +
        '<div class="btn-row"><button class="btn" id="recordRead">Record section as read</button></div>'
      : '<div class="btn-row"><button class="btn" id="revealModel">Reveal a model answer</button></div>' +
        (confirmingSkip
          ? '<p class="skipnote">Recording without recall forfeits the retrieval practice. ' +
            '<button id="skipYes">Record anyway</button> &nbsp;·&nbsp; <button id="skipNo">Stay here</button></p>'
          : '<p class="skipnote"><button id="skipAsk">Record as read without recall</button></p>')) +
    shelfrule();

  const box = document.getElementById("readBox");
  box.addEventListener("input", () => { READ_DRAFT.text = box.value; });
  const record = () => { markSectionRead(id); READ_DRAFT = { id: null, text: "" }; renderReadDone(id); };
  const rv = document.getElementById("revealModel");
  if (rv) rv.addEventListener("click", () => { READ_DRAFT.text = box.value; renderReadGate(id, "revealed"); });
  const rec = document.getElementById("recordRead");
  if (rec) rec.addEventListener("click", record);
  const ask = document.getElementById("skipAsk");
  if (ask) ask.addEventListener("click", () => { READ_DRAFT.text = box.value; renderReadGate(id, "confirmSkip"); });
  const yes = document.getElementById("skipYes");
  if (yes) yes.addEventListener("click", record);
  const no = document.getElementById("skipNo");
  if (no) no.addEventListener("click", () => renderReadGate(id));
  window.scrollTo(0, 0);
}

function renderReadDone(id) {
  const sec = SEC_BY_ID[id];
  const rs = readState(id);
  setBar({ back: true, title: sec.title, metaMain: "Read", metaSub: "recorded", progress: 100 });
  app.innerHTML =
    '<h1 style="font-size:1.8rem">Section read</h1>' +
    '<p class="lede"><b>' + esc(sec.title) + "</b> was recorded as read on " + esc(fmtDay(iso(today()))) + ". " +
      (rs.kind === "locked"
        ? "Its quiz opens <b>" + esc(fmtDay(rs.opens)) + "</b>."
        : "Its quiz is open now.") + "</p>" +
    shelfrule() +
    '<div class="btn-row"><button class="btn" id="goHome">Back to sections</button></div>';
  document.getElementById("goHome").addEventListener("click", () => renderHome());
  window.scrollTo(0, 0);
}

/* ===================================================================
   Screen: free-recall gate
   =================================================================== */
function recallSectionForRun() {
  if (RUN.mode === "section") return SEC_BY_ID[RUN.sectionId];
  // mixed: the most overdue section, else the section best represented in this run
  const pressing = dueSections().filter(d => d.rel.kind === "over" || d.rel.kind === "now");
  if (pressing.length) return pressing[0].sec;
  const counts = {};
  RUN.items.forEach(it => { counts[it.q.section] = (counts[it.q.section] || 0) + 1; });
  const best = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
  return SEC_BY_ID[best];
}

function renderRecall(state) {
  const sec = recallSectionForRun();
  const revealed = state === "revealed";
  const confirmingSkip = state === "confirmSkip";
  setBar({
    back: true,
    title: RUN.mode === "section" ? sec.title : "Mixed review",
    metaMain: "Recall", metaSub: "before questions",
    progress: 2
  });

  app.innerHTML =
    '<p class="qmeta">Free recall' + (RUN.mode === "mixed" ? " · drawn from " + esc(sec.title) : "") + "</p>" +
    '<h2 style="margin-top:.2rem">' + esc(sec.title) + "</h2>" +
    '<div class="recall-frame"><p>' + esc(sec.recallPrompt) + "</p></div>" +
    '<textarea id="recallBox" placeholder="Write what you can, from memory. Nothing here is graded — the effort of retrieval is the point.">' +
      esc(RUN.recallText) + "</textarea>" +
    (revealed
      ? '<div class="model"><h3>For comparison</h3><p>' + esc(sec.modelAnswer) + "</p></div>" +
        '<div class="btn-row"><button class="btn" id="toQuestions">Continue to questions</button></div>'
      : '<div class="btn-row"><button class="btn" id="revealModel">Reveal a model answer</button></div>' +
        (confirmingSkip
          ? '<p class="skipnote">Skipping means no retrieval practice for this run. ' +
            '<button id="skipYes">Skip anyway</button> &nbsp;·&nbsp; <button id="skipNo">Stay here</button></p>'
          : '<p class="skipnote"><button id="skipAsk">Skip the recall step</button></p>')) +
    shelfrule();

  const box = document.getElementById("recallBox");
  box.addEventListener("input", () => { RUN.recallText = box.value; });

  const rv = document.getElementById("revealModel");
  if (rv) rv.addEventListener("click", () => { RUN.recallText = box.value; renderRecall("revealed"); });
  const cont = document.getElementById("toQuestions");
  if (cont) cont.addEventListener("click", () => renderQuestion());
  const ask = document.getElementById("skipAsk");
  if (ask) ask.addEventListener("click", () => { RUN.recallText = box.value; renderRecall("confirmSkip"); });
  const yes = document.getElementById("skipYes");
  if (yes) yes.addEventListener("click", () => renderQuestion());
  const no = document.getElementById("skipNo");
  if (no) no.addEventListener("click", () => renderRecall());
  window.scrollTo(0, 0);
}

/* ===================================================================
   Screen: question
   =================================================================== */
function keywordHits(text, keywords) {
  const t = String(text).toLowerCase().replace(/[‘’]/g, "'");
  return keywords.filter(k => t.indexOf(String(k).toLowerCase().replace(/[‘’]/g, "'")) !== -1);
}

function renderQuestion() {
  const it = RUN.items[RUN.idx];
  const sec = SEC_BY_ID[it.q.section];
  const acc = runAccuracy();
  setBar({
    back: true,
    title: RUN.mode === "section" ? sec.title : "Mixed review",
    metaMain: (RUN.idx + 1) + " / " + RUN.items.length,
    metaSub: acc === null ? "" : Math.round(acc * 100) + "% so far",
    progress: Math.round((RUN.idx / RUN.items.length) * 100)
  });

  const tags = [];
  if (RUN.mode === "mixed") tags.push(esc(sec.title));
  if (it.q.applied) tags.push('<span class="applied">applied</span>');
  if (it.variant === "escalated") {
    tags.push('<span class="esc">' + (it.type === "short" ? "short answer · return visit" : "harder variant · return visit") + "</span>");
  }

  let body =
    '<p class="qmeta">' + (tags.length ? tags.join(" &nbsp;·&nbsp; ") : "&nbsp;") + "</p>" +
    '<p class="qstem">' + esc(it.stem) + "</p>";

  if (it.type === "mc") {
    body += '<ul class="opts" id="opts">';
    it.order.forEach((origIdx, dispIdx) => {
      const letter = String.fromCharCode(65 + dispIdx);
      let cls = "opt";
      if (RUN.revealed) {
        if (dispIdx === it.correctIdx) cls += " right";
        else if (dispIdx === RUN.selected) cls += " wrong";
      } else if (RUN.selected === dispIdx) cls += " sel";
      body += '<li><button class="' + cls + '" data-i="' + dispIdx + '"' +
        (RUN.revealed ? " disabled" : "") + '><span class="mk">' + letter + "</span>" +
        "<span>" + esc(it.options[origIdx]) + "</span></button></li>";
    });
    body += "</ul>";
  } else {
    body += '<textarea class="sm" id="shortBox" placeholder="A sentence or two, from memory."' +
      (RUN.revealed ? " disabled" : "") + ">" + esc(RUN.shortText) + "</textarea>";
    if (!RUN.revealed && !RUN.shortReady) {
      body += '<div class="btn-row"><button class="btn btn-quiet btn-sm" id="shortDone">I’ve written my answer</button></div>';
    }
  }

  /* confidence tap — required before reveal; tapping it is the reveal */
  const readyForConfidence = it.type === "mc" ? (RUN.selected !== null) : RUN.shortReady;
  if (!RUN.revealed && readyForConfidence) {
    body += '<div class="conf"><p>Before you see the answer — how sure are you?</p>' +
      '<div class="btn-row" style="margin-top:0">' +
      '<button class="btn" data-conf="sure">Sure</button>' +
      '<button class="btn btn-quiet" data-conf="unsure">Unsure</button>' +
      "</div></div>";
  }

  if (RUN.revealed) {
    const last = RUN.results[RUN.results.length - 1];
    const ok = last.correct;
    body += '<div class="reveal">' +
      '<div class="verdict ' + (ok ? "ok" : "no") + '">' +
        (ok ? "Correct" : "Missed") +
        "<small>— you said you were " + (last.sure ? "sure" : "unsure") + "</small></div>";
    if (it.type === "short") {
      body += '<p class="kwline"><b>' + RUN.shortHits + " of " + it.keywords.length +
        "</b> key ideas matched (" + it.minKeywords + " needed). Keyword matching is crude — correct the record if it got you wrong.</p>" +
        '<p class="explain" style="margin-top:.9rem"><b>Model answer.</b> ' + esc(it.explanation) + "</p>" +
        '<div class="btn-row"><button class="btn btn-quiet btn-sm" id="flipMark">Mark this as ' +
          (ok ? "missed" : "correct") + " instead</button></div>";
    } else {
      body += '<p class="explain">' + esc(it.explanation) + "</p>";
    }
    body += '<div class="btn-row"><button class="btn" id="nextQ">' +
      (RUN.idx + 1 < RUN.items.length ? "Next question" : "See results") + "</button></div></div>";
  }

  app.innerHTML = body + shelfrule();

  Array.from(document.querySelectorAll(".opt")).forEach(b => {
    b.addEventListener("click", () => {
      if (RUN.revealed) return;
      RUN.selected = parseInt(b.getAttribute("data-i"), 10);
      renderQuestion();
    });
  });
  const sb = document.getElementById("shortBox");
  if (sb) sb.addEventListener("input", () => { RUN.shortText = sb.value; });
  const sd = document.getElementById("shortDone");
  if (sd) sd.addEventListener("click", () => {
    RUN.shortText = sb.value; RUN.shortReady = true; renderQuestion();
  });
  Array.from(document.querySelectorAll("[data-conf]")).forEach(b => {
    b.addEventListener("click", () => doReveal(b.getAttribute("data-conf") === "sure"));
  });
  const fm = document.getElementById("flipMark");
  if (fm) fm.addEventListener("click", flipMark);
  const nq = document.getElementById("nextQ");
  if (nq) nq.addEventListener("click", advance);
  if (!RUN.revealed && RUN.selected === null && !RUN.shortReady) window.scrollTo(0, 0);
}

/* Persistence happens on reveal, advance, and run start — not on navigation. */
function doReveal(sure) {
  const it = RUN.items[RUN.idx];
  let correct;
  if (it.type === "mc") {
    correct = RUN.selected === it.correctIdx;
  } else {
    const hits = keywordHits(RUN.shortText, it.keywords);
    RUN.shortHits = hits.length;
    correct = hits.length >= it.minKeywords;
  }
  RUN.confidence = sure;
  RUN.revealed = true;
  RUN.results.push({ id: it.q.id, section: it.q.section, correct: correct, sure: sure, variant: it.variant });
  applyResult(it, correct);
  STATE.confidence.push({ d: iso(today()), qid: it.q.id, section: it.q.section, sure: sure, correct: correct });
  if (STATE.confidence.length > 600) STATE.confidence = STATE.confidence.slice(-600);
  saveProgressSnapshot();
  Store.save(STATE);
  renderQuestion();
}

function applyResult(it, correct) {
  const ist = itemState(it.q.id);
  if (correct) {
    if (it.variant === "escalated") ist.escalatedCorrect = true;
    else ist.correctOnce = true;
    const i = STATE.missed.indexOf(it.q.id);
    if (i !== -1) STATE.missed.splice(i, 1);
  } else {
    if (it.variant === "escalated") ist.escalatedCorrect = false;
    else ist.correctOnce = false;                        // base form wrong → returns in base form
    if (STATE.missed.indexOf(it.q.id) === -1) STATE.missed.push(it.q.id);
  }
}

function flipMark() {
  const it = RUN.items[RUN.idx];
  const last = RUN.results[RUN.results.length - 1];
  last.correct = !last.correct;
  applyResult(it, last.correct);
  const cl = STATE.confidence[STATE.confidence.length - 1];
  if (cl && cl.qid === it.q.id) cl.correct = last.correct;
  saveProgressSnapshot();
  Store.save(STATE);
  renderQuestion();
}

function advance() {
  RUN.idx++;
  Object.assign(RUN, freshRunFields(), { recallText: RUN.recallText });
  if (RUN.idx >= RUN.items.length) {
    delete STATE.runs[runKey(RUN.mode, RUN.sectionId)];
    finishRun();
  } else {
    saveProgressSnapshot();
    Store.save(STATE);
    renderQuestion();
  }
}

/* ===================================================================
   Screen: results
   =================================================================== */
function finishRun() {
  const total = RUN.results.length;
  const correct = RUN.results.filter(r => r.correct).length;
  const accuracy = total ? correct / total : 0;

  let scheduled = [];
  if (RUN.mode === "section") {
    const r = recordSectionAttempt(RUN.sectionId, accuracy, "section", total);
    scheduled.push({ sec: SEC_BY_ID[RUN.sectionId], due: r.st.dueDate, idx: r.st.intervalIdx, prevIdx: r.prevIdx, acc: accuracy });
  } else {
    // mixed run: score each represented section on its own items, but only reschedule
    // sections with enough items in this run (>=3) that already have a prior attempt
    const bySec = {};
    RUN.results.forEach(r => {
      bySec[r.section] = bySec[r.section] || { n: 0, c: 0 };
      bySec[r.section].n++; if (r.correct) bySec[r.section].c++;
    });
    Object.keys(bySec).forEach(sid => {
      const d = bySec[sid];
      if (d.n < 3) return;
      if (!STATE.sections[sid] || STATE.sections[sid].attempts.length === 0) return;
      const a = d.c / d.n;
      const r = recordSectionAttempt(sid, a, "mixed", d.n);
      scheduled.push({ sec: SEC_BY_ID[sid], due: r.st.dueDate, idx: r.st.intervalIdx, prevIdx: r.prevIdx, acc: a });
    });
  }
  Store.save(STATE);
  renderResults(accuracy, correct, total, scheduled);
}

function renderResults(accuracy, correct, total, scheduled) {
  setBar({ back: true, title: "Run complete", metaMain: Math.round(accuracy * 100) + "%", metaSub: "this run", progress: 100 });

  const sureR = RUN.results.filter(r => r.sure);
  const unsureR = RUN.results.filter(r => !r.sure);
  const sureAcc = sureR.length ? sureR.filter(r => r.correct).length / sureR.length : null;
  const unsureAcc = unsureR.length ? unsureR.filter(r => r.correct).length / unsureR.length : null;
  const highConfErrors = sureR.filter(r => !r.correct).length;

  let calibNote;
  if (sureAcc === null || unsureAcc === null) {
    calibNote = "Calibration needs both kinds of answer in a run to say much. Once you’ve used both taps, this panel compares them.";
  } else if (highConfErrors === 0) {
    calibNote = "No high-confidence errors this run — where you felt sure, you were right.";
  } else if (sureAcc - unsureAcc < 0.15) {
    calibNote = plural(highConfErrors, "item", "items") +
      " you felt sure about turned out wrong, and your accuracy when sure is close to your accuracy when unsure. That gap is where fluency is running ahead of knowledge.";
  } else {
    calibNote = "Your confidence tracks your accuracy reasonably well here, though " + plural(highConfErrors, "item", "items") +
      " you felt sure about still came out wrong — those are the ones worth revisiting.";
  }

  const missedThisRun = RUN.results.filter(r => !r.correct);
  let missedList = "";
  if (missedThisRun.length) {
    missedList = '<h3>Added to the missed pool</h3><ul class="missedlist">';
    missedThisRun.forEach(r => {
      const q = QBY_ID[r.id];
      missedList += '<li><span class="ml-sec">' + esc(SEC_BY_ID[q.section].title) + "</span>" +
        '<span class="ml-stem">' + esc(q.stem) + "</span></li>";
    });
    missedList += "</ul>";
  }

  let sched = "";
  scheduled.forEach(s => {
    const pct = Math.round(PASS_THRESHOLD * 100) + "%";
    const now = intervalLabel(INTERVALS[s.idx]);
    let why;
    if (s.prevIdx < 0) why = "first scored run — the cycle starts at " + now;
    else if (s.idx === s.prevIdx) why = (s.acc >= PASS_THRESHOLD ? "at or above " + pct + ", already at the longest interval" : "below " + pct + ", already at the shortest interval");
    else if (s.idx > s.prevIdx) why = "at or above " + pct + ", so the interval stepped up from " + intervalLabel(INTERVALS[s.prevIdx]);
    else why = "below " + pct + " this run, so the interval stepped back from " + intervalLabel(INTERVALS[s.prevIdx]);
    sched += '<p class="nextdue" data-interval="' + INTERVALS[s.idx] + '"><b>' + esc(s.sec.title) + "</b> — next due <b>" + fmtDate(s.due) + "</b>" +
      " &nbsp;(" + now + " interval; " + why + ")</p>";
  });
  if (!sched && RUN.mode === "mixed") {
    sched = '<p class="nextdue">No section had enough items in this run to move its review date. ' +
      "Section runs, and mixed runs that happen to draw three or more from an already-begun section, adjust the schedule.</p>";
  }

  app.innerHTML =
    '<h1 style="font-size:1.8rem">Run complete</h1>' +
    '<div class="statgrid">' +
      '<div class="stat"><div class="sv">' + correct + "/" + total + '</div><div class="sl">correct</div></div>' +
      '<div class="stat magenta"><div class="sv">' + Math.round(accuracy * 100) + '%</div><div class="sl">accuracy</div></div>' +
      '<div class="stat apple"><div class="sv">' + highConfErrors + '</div><div class="sl">sure but wrong</div></div>' +
    "</div>" +
    '<div class="calib"><h3>Calibration</h3><table><tr><td>Accuracy when <b>sure</b></td><td>' +
      (sureAcc === null ? "—" : Math.round(sureAcc * 100) + "% of " + sureR.length) + "</td></tr>" +
      "<tr><td>Accuracy when <b>unsure</b></td><td>" +
      (unsureAcc === null ? "—" : Math.round(unsureAcc * 100) + "% of " + unsureR.length) + "</td></tr></table>" +
      '<p class="note">' + calibNote + "</p></div>" +
    sched +
    missedList +
    shelfrule() +
    '<div class="btn-row"><button class="btn" id="goHome">Back to sections</button>' +
    (anyFirstPassDone() ? '<button class="btn btn-quiet" id="goMixed">Another mixed review</button>' : "") +
    "</div>";

  document.getElementById("goHome").addEventListener("click", () => renderHome());
  const gm = document.getElementById("goMixed");
  if (gm) gm.addEventListener("click", () => {
    if (STATE.runs.__mixed__) resumeRun("__mixed__");
    else { startRun("mixed", null); renderRecall(); }
  });
  window.scrollTo(0, 0);
}

/* ===================================================================
   Boot
   =================================================================== */
tbBack.addEventListener("click", () => renderHome());

/* Engine-v1 state → v2: map each section's interval index by its length in
   days onto the nearest v2 interval (7 → 1 week, 30 → 1 month, …); due dates
   are kept as they were. Not saved until the next reveal/advance/run start. */
function migrateV1(st) {
  Object.keys(st.sections || {}).forEach(id => {
    const sec = st.sections[id];
    if (sec.recallOnlyAt === undefined) sec.recallOnlyAt = null;
    if (typeof sec.intervalIdx === "number" && sec.intervalIdx >= 0) {
      const days = LEGACY_INTERVALS_V1[Math.min(sec.intervalIdx, LEGACY_INTERVALS_V1.length - 1)];
      let best = 0;
      INTERVALS.forEach((d, i) => { if (Math.abs(d - days) < Math.abs(INTERVALS[best] - days)) best = i; });
      sec.intervalIdx = best;
    }
  });
  st.version = STATE_VERSION;
}

/* A snapshot survives only if every item still exists in the bank with the
   same stem — a rebuilt question set must never resume stale items. */
function snapshotValid(r) {
  if (!r || !Array.isArray(r.items) || typeof r.idx !== "number") return false;
  if (r.idx < 0 || r.idx >= r.items.length) return false;
  return r.items.every(it => it && it.q && QBY_ID[it.q.id] && QBY_ID[it.q.id].stem === it.q.stem);
}

(async function boot() {
  const loaded = await Store.load();
  if (loaded && (loaded.version === 1 || loaded.version === STATE_VERSION)) {
    if (loaded.version === 1) migrateV1(loaded);
    STATE = Object.assign(blankState(), loaded);
    STATE.sections = {};
    Object.keys(loaded.sections || {}).forEach(id => { if (SEC_BY_ID[id]) STATE.sections[id] = loaded.sections[id]; });
    STATE.items = loaded.items || {};
    STATE.missed = (loaded.missed || []).filter(id => QBY_ID[id]);
    STATE.confidence = loaded.confidence || [];
    STATE.runs = loaded.runs || {};
    Object.keys(STATE.runs).forEach(key => {
      if (!snapshotValid(STATE.runs[key])) delete STATE.runs[key];
    });
  }
  showDateBanner();
  renderHome();
})();

/* QA hook: a visible banner whenever ?today= is present, so a simulated date is never mistaken for the real one. */
function showDateBanner() {
  if (!DATE_OVERRIDE.active && !DATE_OVERRIDE.invalid) return;
  const bar = document.createElement("div");
  bar.className = "testdate" + (DATE_OVERRIDE.active ? "" : " bad");
  bar.id = "testDateBanner";
  bar.textContent = DATE_OVERRIDE.active
    ? "Test date override — acting as " + fmtDay(DATE_OVERRIDE.iso) + " (" + DATE_OVERRIDE.iso + "). Remove ?today= to use the real date."
    : "Ignored ?today=" + DATE_OVERRIDE.invalid + " — use YYYY-MM-DD. Using the real date.";
  const tb = document.getElementById("topbar");
  tb.insertBefore(bar, tb.firstChild);
}

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
