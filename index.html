<style>
:root{
  --paper:#F4EDE0;
  --paper-raised:#FBF6EC;
  --paper-sunk:#EDE3D2;
  --ink:#372E26;
  --ink-soft:#6B5E51;
  --ink-faint:#9A8B7B;
  --ochre:#BE8724;
  --ochre-deep:#8F6413;
  --ochre-wash:#F0E0BE;
  --rose:#AC6A75;
  --rose-deep:#8A4E58;
  --rose-wash:#F0DCDE;
  --cloud:#A9A2A8;
  --cloud-wash:#E2DDDF;
  --rule:#DCCFBA;
  --green:#5C7551;
  --green-wash:#E0E8DA;
  --shadow:0 1px 2px rgba(55,46,38,.05), 0 6px 18px -10px rgba(55,46,38,.22);

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--body);
  font-size:17px;
  line-height:1.62;
  -webkit-font-smoothing:antialiased;
  padding-bottom:5rem;
}
.wrap{max-width:41rem;margin:0 auto;padding:0 1.35rem}

/* ── the signature: a sun partially occluded by cloud, used as section rule ── */
.sunrule{
  position:relative;height:2.5rem;margin:2.2rem 0 2rem;
  display:flex;align-items:center;justify-content:center;
}
.sunrule::before{
  content:"";position:absolute;left:0;right:0;top:50%;height:1px;
  background:linear-gradient(to right,transparent,var(--rule) 18%,var(--rule) 82%,transparent);
}
.sunrule i{
  position:relative;display:block;width:3.4rem;height:2.5rem;
  background:var(--paper);
}
.sunrule i::before{
  content:"";position:absolute;left:50%;top:.28rem;width:1.15rem;height:1.15rem;margin-left:-.575rem;
  border-radius:50%;background:var(--ochre);
  box-shadow:0 0 0 .34rem var(--ochre-wash);
}
.sunrule i::after{
  content:"";position:absolute;left:.15rem;right:.15rem;top:1.28rem;height:.42rem;border-radius:.42rem;
  background:var(--cloud-wash);
  box-shadow:
    -.42rem -.2rem 0 -.06rem var(--cloud-wash),
     .46rem -.13rem 0 -.11rem var(--cloud-wash);
}

/* ── sticky bar ── */
.topbar{
  position:sticky;top:0;z-index:20;
  background:rgba(244,237,224,.93);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid var(--rule);
}
.topbar .wrap{display:flex;align-items:center;gap:.85rem;min-height:3.3rem;padding-top:.4rem;padding-bottom:.4rem}
.topbar .tb-back{
  font-family:var(--ui);font-size:.78rem;letter-spacing:.02em;
  background:none;border:0;color:var(--ink-soft);cursor:pointer;padding:.3rem .1rem;
  flex:0 0 auto;
}
.topbar .tb-back:hover{color:var(--ochre-deep)}
.topbar .tb-title{
  flex:1 1 auto;min-width:0;font-family:var(--display);font-weight:500;font-size:.98rem;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.topbar .tb-meta{
  flex:0 0 auto;font-family:var(--ui);font-size:.74rem;color:var(--ink-faint);
  letter-spacing:.03em;text-align:right;line-height:1.35;
}
.topbar .tb-meta b{display:block;font-weight:600;color:var(--ink-soft);font-size:.8rem}
.progressline{height:2px;background:var(--paper-sunk)}
.progressline > span{display:block;height:100%;background:var(--ochre);transition:width .3s ease}

/* ── typography ── */

}

.subtitle{font-family:var(--ui);font-size:.82rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 .2rem}
.byline{color:var(--ink-soft);font-size:.98rem;margin:.2rem 0 0}
h2{font-family:var(--display);font-weight:500;font-size:1.24rem;margin:2.3rem 0 .7rem;letter-spacing:-.005em}
h3{font-family:var(--ui);font-weight:600;font-size:.76rem;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-faint);margin:2rem 0 .8rem}
p{margin:0 0 1rem}
.lede{font-size:1.02rem;color:var(--ink-soft)}

/* ── buttons ── */
.btn{

  background:var(--ink);color:var(--paper-raised);border:1px solid var(--ink);
  padding:.72rem 1.15rem;border-radius:2px;cursor:pointer;
  transition:background .15s,border-color .15s,color .15s;
  line-height:1.3;
}
.btn:hover{background:var(--ochre-deep);border-color:var(--ochre-deep)}
.btn:disabled{opacity:.4;cursor:default}
.btn:disabled:hover{background:var(--ink);border-color:var(--ink)}
.btn-quiet{
  background:transparent;color:var(--ink-soft);border:1px solid var(--rule);
}
.btn-quiet:hover{background:var(--paper-raised);color:var(--ochre-deep);border-color:var(--ochre)}
.btn-sm{font-size:.8rem;padding:.5rem .8rem}
.btn-row{display:flex;flex-wrap:wrap;gap:.65rem;align-items:center;margin-top:1.3rem}
:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}

/* ── due panel ── */
.duepanel{
  border:1px solid var(--rule);background:var(--paper-raised);
  border-radius:3px;padding:1.15rem 1.25rem 1.25rem;margin:1.6rem 0 0;box-shadow:var(--shadow);
}
.duepanel h3{margin-top:0}
.duelist{list-style:none;margin:0;padding:0}
.duelist li{
  display:flex;align-items:baseline;gap:.7rem;padding:.55rem 0;
  border-top:1px solid var(--rule);
}
.duelist li:first-child{border-top:0}
.duelist .dl-name{flex:1 1 auto;font-family:var(--display);font-size:1rem;font-weight:500}
.duelist .dl-name small{display:block;font-family:var(--ui);font-weight:400;font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);margin-top:.1rem}
.duelist .dl-when{flex:0 0 auto;font-family:var(--ui);font-size:.79rem;color:var(--ink-soft);text-align:right}
.tag{

  letter-spacing:.07em;text-transform:uppercase;padding:.16rem .42rem;border-radius:2px;
}
.tag-over{background:var(--rose-wash);color:var(--rose-deep)}
.tag-now{background:var(--ochre-wash);color:var(--ochre-deep)}
.tag-new{background:var(--cloud-wash);color:var(--ink-soft)}
.tag-continue{background:var(--green-wash);color:var(--green)}
.empty-note{color:var(--ink-faint);font-size:.92rem;margin:0}

.seclist{list-style:none;margin:.4rem 0 0;padding:0}

.seccard:hover{border-color:var(--ochre);background:#FDF9F1}
.seccard .sc-id{

.seccard .sc-body{flex:1 1 auto;min-width:0}
.seccard .sc-title{display:block;font-family:var(--display);font-size:1.04rem;font-weight:500;line-height:1.3}
.seccard .sc-sub{display:block;font-family:var(--ui);font-size:.73rem;letter-spacing:.045em;text-transform:uppercase;color:var(--ink-faint);margin-top:.12rem;line-height:1.45}
.seccard .sc-state{display:block;font-family:var(--ui);font-size:.79rem;color:var(--ink-soft);margin-top:.5rem}
.seccard .sc-state .dot{color:var(--rule);margin:0 .4rem}

/* ── recall gate ── */
.recall-frame{

.recall-frame p:last-child{margin-bottom:0}
textarea{
  width:100%;min-height:9.5rem;font-family:var(--body);font-size:1rem;line-height:1.6;

  padding:.85rem .95rem;resize:vertical;

textarea:focus{border-color:var(--ochre);outline:none;box-shadow:0 0 0 3px var(--ochre-wash)}
textarea.sm{min-height:6.5rem}
.model{
  border:1px solid var(--rule);border-left:2px solid var(--cloud);

.model h3{margin:0 0 .5rem}

.qmeta{font-family:var(--ui);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin:1.9rem 0 .55rem}
.qmeta .applied{color:var(--rose-deep)}
.qmeta .esc{color:var(--ochre-deep)}
.qstem{font-family:var(--display);font-weight:400;font-size:1.2rem;line-height:1.42;margin:0 0 1.25rem;letter-spacing:-.004em}
.opts{list-style:none;margin:0;padding:0}
.opt{
  width:100%;text-align:left;font:inherit;color:inherit;
  background:var(--paper-raised);border:1px solid var(--rule);border-radius:3px;
  padding:.8rem .95rem;margin-bottom:.55rem;cursor:pointer;
  display:flex;gap:.75rem;align-items:flex-start;line-height:1.5;
  transition:border-color .13s,background .13s;
}
.opt:hover:not(:disabled){border-color:var(--ochre)}
.opt:disabled{cursor:default}
.opt .mk{
  flex:0 0 1.35rem;height:1.35rem;border-radius:50%;border:1px solid var(--rule);
  font-family:var(--ui);font-size:.72rem;font-weight:600;color:var(--ink-faint);
  display:flex;align-items:center;justify-content:center;margin-top:.1rem;
}
.opt.sel{border-color:var(--ink);background:#FDF9F1}
.opt.sel .mk{border-color:var(--ink);background:var(--ink);color:var(--paper-raised)}
.opt.right{border-color:var(--green);background:var(--green-wash)}
.opt.right .mk{border-color:var(--green);background:var(--green);color:#fff}
.opt.wrong{border-color:var(--rose);background:var(--rose-wash)}
.opt.wrong .mk{border-color:var(--rose);background:var(--rose);color:#fff}

/* ── confidence ── */
.conf{margin-top:1.35rem;border-top:1px solid var(--rule);padding-top:1.15rem}
.conf p{font-family:var(--ui);font-size:.8rem;letter-spacing:.03em;color:var(--ink-soft);margin:0 0 .6rem}
.conf .btn{min-width:7rem}

/* ── reveal ── */
.reveal{margin-top:1.5rem;border-top:1px solid var(--rule);padding-top:1.25rem}
.verdict{font-family:var(--ui);font-size:.76rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin:0 0 .7rem}
.verdict.ok{color:var(--green)}
.verdict.no{color:var(--rose-deep)}
.verdict small{font-weight:400;letter-spacing:.05em;text-transform:none;color:var(--ink-faint);margin-left:.5rem;font-size:.78rem}
.explain{color:var(--ink-soft);margin:0}
.explain + .explain{margin-top:.9rem}
.kwline{font-family:var(--ui);font-size:.78rem;color:var(--ink-faint);margin:.7rem 0 0}
.kwline b{color:var(--ink-soft);font-weight:600}

/* ── results ── */
.statgrid{display:flex;flex-wrap:wrap;gap:.6rem;margin:1.3rem 0 .4rem}
.stat{
  flex:1 1 8rem;border:1px solid var(--rule);background:var(--paper-raised);
  border-radius:3px;padding:.85rem .95rem;
}
.stat .sv{font-family:var(--display);font-size:1.7rem;font-weight:400;line-height:1.1}
.stat .sl{font-family:var(--ui);font-size:.71rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin-top:.25rem}
.stat.rose .sv{color:var(--rose-deep)}
.stat.ochre .sv{color:var(--ochre-deep)}
.calib{border:1px solid var(--rule);border-left:2px solid var(--rose);background:var(--paper-raised);padding:1rem 1.15rem;margin-top:1.2rem}
.calib h3{margin:0 0 .6rem}
.calib table{width:100%;border-collapse:collapse;font-family:var(--ui);font-size:.86rem}
.calib td{padding:.35rem 0;border-top:1px solid var(--rule)}
.calib tr:first-child td{border-top:0}
.calib td:last-child{text-align:right;font-weight:600}
.calib .note{font-family:var(--body);font-size:.92rem;color:var(--ink-soft);margin:.85rem 0 0}
.nextdue{font-family:var(--ui);font-size:.86rem;color:var(--ink-soft);margin-top:1.3rem;padding-top:1rem;border-top:1px solid var(--rule)}
.nextdue b{color:var(--ink);font-weight:600}

.footnote{font-family:var(--ui);font-size:.75rem;color:var(--ink-faint);margin-top:3rem;padding-top:1.2rem;border-top:1px solid var(--rule);line-height:1.7}
.linklike{font-family:var(--ui);font-size:.75rem;color:var(--ink-faint);background:none;border:0;padding:0;text-decoration:underline;cursor:pointer}
.linklike:hover{color:var(--rose-deep)}
.hidden{display:none !important}

@media (max-width:520px){
  body{font-size:16px}
  h1{font-size:1.72rem}
  .qstem{font-size:1.1rem}
  .topbar .tb-meta{font-size:.7rem}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important}
}
</style>

    modelAnswer: "Absolute love is unconditional, unwavering, and meets others being-to-being (\"water poured into water\") — it is who we essentially are, not something a person gives us. Relative love is person-to-person, dependent on time and circumstance, and inevitably waxes and wanes because everyone is a distinct, limited, imperfect vessel. The wound is born when infants — who initially experience their mother as the very source of love — inevitably meet her limitations; since parents can't sustain unconditional love perfectly, children conclude \"I am not truly loved,\" a narcissistic injury that hardens into grievance. Confusing relative love for absolute (expecting a person to be a perfectly steady source) sets up repeated disappointment."

    modelAnswer: "Just as there's a \"bad other,\" there's a \"bad self\" — an internalized sense of being not-good-enough, policed by an inner critic that keeps demanding proof of worth (a trial that can never be won). Unconscious suffering is being passively carried away and overwhelmed by feeling, as a helpless child once had to be; conscious suffering is actively meeting and opening to the same feeling with awareness, discovering that one's openness is bigger than the feeling itself. Self-love, for Welwood, isn't positive self-talk — it's \"letting yourself be the being that you are\": meeting your actual, moment-to-moment experience without judgment (\"yes, this is what's here\") rather than measuring yourself against any fixed self-concept, good or bad."

/* ===================================================================
   Perfect Love, Imperfect Relationships — self-quiz engine
   =================================================================== */

const ALL_QUESTIONS = [].concat(
  QUESTIONS_A, QUESTIONS_B, QUESTIONS_C, QUESTIONS_D,
  QUESTIONS_E, QUESTIONS_F, QUESTIONS_G
);
const QBY_ID = {};
ALL_QUESTIONS.forEach(q => { QBY_ID[q.id] = q; });
const SEC_BY_ID = {};
SECTIONS.forEach(s => { SEC_BY_ID[s.id] = s; });

/* ── intervals: 1 week → 1 month → 3 months → 6 months ── */
const INTERVALS = [7, 30, 91, 182];
const INTERVAL_LABEL = ["1 week", "1 month", "3 months", "6 months"];
const PASS_THRESHOLD = 0.80;
const MIXED_RUN_SIZE = 12;
const STORAGE_KEY = "welwood-plir:state";

/* ===================================================================
   Storage — window.storage with in-memory fallback
   =================================================================== */
const Store = (() => {
  let memory = null;
  let usingFallback = false;

  async function load() {
    try {
      const raw = window.localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
      return null;
    } catch (e) {
      usingFallback = true;
      return memory ? JSON.parse(memory) : null;
    }
  }

  async function save(state) {
    const payload = JSON.stringify(state);
    memory = payload;
    try {
      window.localStorage.setItem(STORAGE_KEY, payload);
    } catch (e) {
      usingFallback = true;
    }
  }

  return { load, save, isFallback: () => usingFallback };
})();

function blankState() {
  return { version: 1, sections: {}, items: {}, missed: [], confidence: [], runs: {} };
}

let STATE = blankState();

function sectionState(id) {
  if (!STATE.sections[id]) {
    STATE.sections[id] = { attempts: [], intervalIdx: -1, dueDate: null };
  }
  return STATE.sections[id];
}
function itemState(id) {
  if (!STATE.items[id]) STATE.items[id] = { correctOnce: false, escalatedCorrect: false };
  return STATE.items[id];
}

/* ===================================================================
   Dates
   =================================================================== */
function today() { const d = new Date(); d.setHours(0, 0, 0, 0); return d; }
function addDays(date, n) { const d = new Date(date); d.setDate(d.getDate() + n); return d; }
function iso(d) { return d.toISOString().slice(0, 10); }
function parseISO(s) { const d = new Date(s + "T00:00:00"); d.setHours(0, 0, 0, 0); return d; }
function daysBetween(a, b) { return Math.round((b - a) / 86400000); }
function fmtDate(s) {
  const d = parseISO(s);
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
}
function relDue(dueISO) {
  const n = daysBetween(today(), parseISO(dueISO));   // negative = overdue
  if (n < 0) return { kind: "over", key: n, days: -n, text: "overdue by " + (-n) + (-n === 1 ? " day" : " days") };
  if (n === 0) return { kind: "now", key: 0, days: 0, text: "due today" };
  if (n === 1) return { kind: "soon", key: 1, days: 1, text: "due tomorrow" };
  return { kind: "soon", key: n, days: n, text: "next due " + fmtDate(dueISO) };
}

/* ===================================================================
   Scheduling
   =================================================================== */
function recordSectionAttempt(sectionId, accuracy, mode, n) {
  const st = sectionState(sectionId);
  st.attempts.push({ d: iso(today()), acc: Math.round(accuracy * 1000) / 1000, mode: mode, n: n });
  if (st.intervalIdx < 0) {
    st.intervalIdx = 0;                                  // first pass → 1 week
  } else if (accuracy >= PASS_THRESHOLD) {
    st.intervalIdx = Math.min(st.intervalIdx + 1, INTERVALS.length - 1);
  } else {
    st.intervalIdx = 0;                                  // below 80% → reset to 1 week
  }
  st.dueDate = iso(addDays(today(), INTERVALS[st.intervalIdx]));
  return st;
}

function sectionStatus(id) {
  const st = STATE.sections[id];
  if (!st || st.attempts.length === 0) return { kind: "new", label: "not yet begun" };
  const r = relDue(st.dueDate);
  return { kind: r.kind, label: r.text, due: st.dueDate, attempts: st.attempts.length };
}

function dueSections() {
  return SECTIONS
    .filter(s => STATE.sections[s.id] && STATE.sections[s.id].attempts.length > 0)
    .map(s => ({ sec: s, rel: relDue(STATE.sections[s.id].dueDate) }))
    .sort((a, b) => a.rel.key - b.rel.key);
}

function anyFirstPassDone() {
  return SECTIONS.some(s => STATE.sections[s.id] && STATE.sections[s.id].attempts.length > 0);
}

/* ===================================================================
   Question selection
   =================================================================== */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* An item comes back harder if it was answered correctly on a prior visit. */
function variantFor(q) {
  const st = STATE.items[q.id];
  if (st && st.correctOnce && q.escalated) return "escalated";
  return "base";
}

function buildRun(mode, sectionId) {
  let pool;
  if (mode === "section") {
    pool = shuffle(ALL_QUESTIONS.filter(q => q.section === sectionId));
  } else {
    const missedSet = STATE.missed.slice();
    const missedQs = shuffle(missedSet.map(id => QBY_ID[id]).filter(Boolean))
      .slice(0, Math.min(4, Math.ceil(MIXED_RUN_SIZE / 3)));
    const missedIds = new Set(missedQs.map(q => q.id));
    const rest = shuffle(ALL_QUESTIONS.filter(q => !missedIds.has(q.id)));
    pool = missedQs.concat(rest).slice(0, MIXED_RUN_SIZE);
    pool = shuffle(pool);
  }
  return pool.map(q => {
    const variant = variantFor(q);
    const isEsc = variant === "escalated";
    const esc = q.escalated || {};
    const type = isEsc ? (esc.type === "short" ? "short" : "mc") : "mc";
    let stem, options, correct, explanation;
    if (isEsc && type === "short") {
      stem = esc.prompt;
      options = null; correct = null;
      explanation = esc.sampleAnswer;
    } else if (isEsc) {
      stem = esc.stem || q.stem;
      options = esc.options; correct = esc.correct;
      explanation = esc.explanation;
    } else {
      stem = q.stem; options = q.options; correct = q.correct;
      explanation = q.explanation;
    }
    let order = null, correctIdx = null;
    if (options) {
      order = shuffle(options.map((_, i) => i));           // options shuffled every load
      correctIdx = order.indexOf(correct);
    }
    return {
      q: q, variant: variant, type: type,
      stem: stem, options: options, order: order, correctIdx: correctIdx,
      explanation: explanation,
      keywords: esc.keywords || [], minKeywords: esc.minKeywords || 1
    };
  });
}

/* ===================================================================
   Run state
   =================================================================== */
let RUN = null;

function startRun(mode, sectionId) {
  const items = buildRun(mode, sectionId);
  RUN = {
    mode: mode, sectionId: sectionId, items: items, idx: 0,
    results: [], selected: null, confidence: null, revealed: false,
    shortText: "", shortHits: 0, shortAuto: null, recallText: ""
  };
  saveProgressSnapshot();
  Store.save(STATE);
}

function runKey(mode, sectionId) { return mode === "section" ? sectionId : "__mixed__"; }

/* Snapshot the in-progress run so it can be resumed later — keyed per
   section (and separately for mixed review), so switching between
   sections freely keeps each one's place. Cleared once that run finishes. */
function saveProgressSnapshot() {
  if (!RUN) return;
  const key = runKey(RUN.mode, RUN.sectionId);
  if (RUN.idx >= RUN.items.length) { delete STATE.runs[key]; return; }
  STATE.runs[key] = {
    mode: RUN.mode, sectionId: RUN.sectionId,
    items: RUN.items, idx: RUN.idx, results: RUN.results
  };
}

function resumeRun(key) {
  const snap = STATE.runs[key];
  if (!snap) return;
  RUN = {
    mode: snap.mode, sectionId: snap.sectionId, items: snap.items, idx: snap.idx,
    results: snap.results, selected: null, confidence: null, revealed: false,
    shortText: "", shortHits: 0, shortAuto: null, recallText: ""
  };
  renderQuestion();
}

function runAccuracy() {
  if (!RUN || RUN.results.length === 0) return null;
  const c = RUN.results.filter(r => r.correct).length;
  return c / RUN.results.length;
}

/* ===================================================================
   Rendering helpers
   =================================================================== */
const app = document.getElementById("app");
const tbBack = document.getElementById("tbBack");
const tbTitle = document.getElementById("tbTitle");
const tbMeta = document.getElementById("tbMeta");
const tbProgress = document.getElementById("tbProgress");

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

function setBar(opts) {
  tbBack.classList.toggle("hidden", !opts.back);
  tbTitle.textContent = opts.title || "Perfect Love, Imperfect Relationships";
  if (opts.metaMain) {
    tbMeta.innerHTML = "<b>" + esc(opts.metaMain) + "</b>" + (opts.metaSub ? esc(opts.metaSub) : "");
  } else {
    tbMeta.textContent = "";
  }
  tbProgress.style.width = (opts.progress || 0) + "%";
}

function sunrule() { return '<div class="sunrule"><i></i></div>'; }

/* ===================================================================
   Screen: Home
   =================================================================== */
function renderHome(state) {
  RUN = null;
  /* renderHome is also used directly as a click handler, so `state` may be an
     Event — only the exact string arms the confirm. */
  const confirmingReset = state === "confirmReset";
  setBar({ back: false, progress: 0 });
  const due = dueSections();
  const overdueOrNow = due.filter(d => d.rel.kind === "over" || d.rel.kind === "now");
  const upcoming = due.filter(d => d.rel.kind === "soon");
  const started = anyFirstPassDone();

  let duePanel = '<div class="duepanel"><h3>Due for review</h3>';
  if (due.length === 0) {
    duePanel += '<p class="empty-note">Nothing scheduled yet. A section enters the review cycle after its first pass — one week later, then one month, three months, six months.</p>';
  } else {
    duePanel += '<ul class="duelist">';
    overdueOrNow.concat(upcoming).forEach(d => {
      const tagCls = d.rel.kind === "over" ? "tag-over" : (d.rel.kind === "now" ? "tag-now" : "");
      const when = (d.rel.kind === "over" || d.rel.kind === "now")
        ? '<span class="tag ' + tagCls + '">' + esc(d.rel.text) + "</span>"
        : esc(d.rel.text);
      duePanel += '<li><span class="dl-name">' + esc(d.sec.title) +
        "<small>" + esc(d.sec.subtitle) + "</small></span>" +
        '<span class="dl-when">' + when + "</span></li>";
    });
    duePanel += "</ul>";
  }
  duePanel += "</div>";

  let secList = '<ul class="seclist">';
  SECTIONS.forEach(s => {
    const st = sectionStatus(s.id);
    const n = ALL_QUESTIONS.filter(q => q.section === s.id).length;
    const inProg = STATE.runs[s.id];
    let stateLine = "";
    if (inProg) {
      stateLine = '<span class="tag tag-continue">continue</span>' +
        '<span class="dot">·</span>question ' + (inProg.idx + 1) + " of " + inProg.items.length;
    } else if (st.kind === "new") {
      stateLine = '<span class="tag tag-new">not yet begun</span>';
    } else {
      const tagCls = st.kind === "over" ? "tag-over" : (st.kind === "now" ? "tag-now" : "");
      stateLine = (st.kind === "over" || st.kind === "now")
        ? '<span class="tag ' + tagCls + '">' + esc(st.label) + "</span>"
        : esc(st.label);
      stateLine += '<span class="dot">·</span>' + st.attempts + (st.attempts === 1 ? " pass" : " passes");
    }
    secList += '<li><button class="seccard" data-sec="' + s.id + '">' +
      '<span class="sc-id">' + s.id + "</span>" +
      '<span class="sc-body"><span class="sc-title">' + esc(s.title) + "</span>" +
      '<span class="sc-sub">' + esc(s.subtitle) + " · " + n + " questions</span>" +
      '<span class="sc-state">' + stateLine + "</span></span></button></li>";
  });
  secList += "</ul>";

  const missedCount = STATE.missed.length;

  app.innerHTML =
    '<p class="subtitle">John Welwood · Trumpeter, 2006</p>' +
    "<h1>Perfect Love,<br><em>Imperfect Relationships</em></h1>" +
    '<p class="byline">Healing the Wound of the Heart — a self-quiz in ' +
      SECTIONS.length + " sections, " + ALL_QUESTIONS.length + " questions.</p>" +
    duePanel +
    (started
      ? "<h3>Mixed review</h3>" +
        '<p class="lede">Draws ' + MIXED_RUN_SIZE + " questions at random across the whole book" +
          (missedCount ? ", weighted toward the " + missedCount + " you've missed" : "") +
          ". Interleaving forces discrimination between neighbouring distinctions rather than letting each section be answered from short-term context.</p>" +
        '<div class="btn-row"><button class="btn" id="startMixed">' +
          (STATE.runs.__mixed__ ? "Continue mixed review \u2014 question " + (STATE.runs.__mixed__.idx + 1) + " of " + STATE.runs.__mixed__.items.length : "Begin mixed review") +
        "</button></div>" +
        "<h3>By section</h3>"
      : "<h3>Sections</h3>" +
        '<p class="lede">Work through a section in order for the first pass. Mixed review unlocks once you\u2019ve completed one.</p>') +
    secList +
    (started
      ? ""
      : "") +
    sunrule() +
    '<p class="footnote">Each section opens with a free-recall prompt before any multiple choice. ' +
      "Every answer is preceded by a confidence tap, and the calibration readout at the end of each run shows accuracy when sure against accuracy when unsure. " +
      "Items answered correctly on a prior visit return in a harder form. Progress is stored on this device" +
      (Store.isFallback() ? " (in memory only for this session \u2014 persistent storage is unavailable here)" : "") +
      ".</p>" +
    (confirmingReset
      ? '<p class="footnote">This clears every section\u2019s history, due dates, and the missed-question pool. It can\u2019t be undone. ' +
        '<button class="linklike" id="resetYes">Reset everything</button> &nbsp;\u00b7&nbsp; ' +
        '<button class="linklike" id="resetNo">Cancel</button></p>'
      : '<p class="footnote"><button class="linklike" id="resetAll">Reset all progress</button></p>');

  const mixBtn = document.getElementById("startMixed");
  if (mixBtn) mixBtn.addEventListener("click", () => {
    if (STATE.runs.__mixed__) { resumeRun("__mixed__"); }
    else { startRun("mixed", null); renderRecall(); }
  });
  Array.from(document.querySelectorAll("[data-sec]")).forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.getAttribute("data-sec");
      if (STATE.runs[id]) { resumeRun(id); }
      else { startRun("section", id); renderRecall(); }
    });
  });
  /* Inline two-click confirm — native confirm() is blocked without notice in
     sandboxed frames, which would make this control silently do nothing. */
  const resetBtn = document.getElementById("resetAll");
  if (resetBtn) resetBtn.addEventListener("click", () => renderHome("confirmReset"));
  const resetYes = document.getElementById("resetYes");
  if (resetYes) resetYes.addEventListener("click", () => {
    STATE = blankState();
    Store.save(STATE);
    renderHome();
  });
  const resetNo = document.getElementById("resetNo");
  if (resetNo) resetNo.addEventListener("click", () => renderHome());
  window.scrollTo(0, 0);
}

/* ===================================================================
   Screen: free-recall gate
   =================================================================== */
function recallSectionForRun() {
  if (RUN.mode === "section") return SEC_BY_ID[RUN.sectionId];
  // mixed: use the most overdue section, else the section best represented in this run
  const due = dueSections();
  if (due.length) return due[0].sec;
  const counts = {};
  RUN.items.forEach(it => { counts[it.q.section] = (counts[it.q.section] || 0) + 1; });
  const best = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
  return SEC_BY_ID[best];
}

function renderRecall(state) {
  const sec = recallSectionForRun();
  const revealed = state === "revealed";
  const confirmingSkip = state === "confirmSkip";
  setBar({
    back: true,
    title: RUN.mode === "section" ? sec.title : "Mixed review",
    metaMain: "Recall", metaSub: "before questions",
    progress: 2
  });

  app.innerHTML =
    '<p class="qmeta">Free recall' + (RUN.mode === "mixed" ? " · drawn from " + esc(sec.title) : "") + "</p>" +
    '<h2 style="margin-top:.2rem">' + esc(sec.title) + "</h2>" +
    '<div class="recall-frame"><p>' + esc(sec.recallPrompt) + "</p></div>" +
    '<textarea id="recallBox" placeholder="Write what you can, from memory. Nothing here is graded \u2014 the effort of retrieval is the point." ' +
      (revealed ? "" : "") + ">" + esc(RUN.recallText) + "</textarea>" +
    (revealed
      ? '<div class="model"><h3>For comparison</h3><p>' + esc(sec.modelAnswer) + "</p></div>" +
        '<div class="btn-row"><button class="btn" id="toQuestions">Continue to questions</button></div>'
      : '<div class="btn-row"><button class="btn" id="revealModel">Reveal a model answer</button></div>' +
        (confirmingSkip
          ? '<p class="skipnote">Skipping means no retrieval practice for this run. ' +
            '<button id="skipYes">Skip anyway</button> &nbsp;·&nbsp; <button id="skipNo">Stay here</button></p>'
          : '<p class="skipnote"><button id="skipAsk">Skip the recall step</button></p>')) +
    sunrule();

  const box = document.getElementById("recallBox");
  box.addEventListener("input", () => { RUN.recallText = box.value; });

  const rv = document.getElementById("revealModel");
  if (rv) rv.addEventListener("click", () => { RUN.recallText = box.value; renderRecall("revealed"); });
  const cont = document.getElementById("toQuestions");
  if (cont) cont.addEventListener("click", () => renderQuestion());
  const ask = document.getElementById("skipAsk");
  if (ask) ask.addEventListener("click", () => { RUN.recallText = box.value; renderRecall("confirmSkip"); });
  const yes = document.getElementById("skipYes");
  if (yes) yes.addEventListener("click", () => renderQuestion());
  const no = document.getElementById("skipNo");
  if (no) no.addEventListener("click", () => renderRecall());
  window.scrollTo(0, 0);
}

/* ===================================================================
   Screen: question
   =================================================================== */
function keywordHits(text, keywords) {
  const t = text.toLowerCase();
  return keywords.filter(k => t.indexOf(String(k).toLowerCase()) !== -1);
}

function renderQuestion() {
  const it = RUN.items[RUN.idx];
  const sec = SEC_BY_ID[it.q.section];
  const acc = runAccuracy();
  setBar({
    back: true,
    title: RUN.mode === "section" ? sec.title : "Mixed review",
    metaMain: (RUN.idx + 1) + " / " + RUN.items.length,
    metaSub: acc === null ? "" : Math.round(acc * 100) + "% so far",
    progress: Math.round((RUN.idx / RUN.items.length) * 100)
  });

  const tags = [];
  if (RUN.mode === "mixed") tags.push(esc(sec.title));
  if (it.q.applied) tags.push('<span class="applied">applied</span>');
  if (it.variant === "escalated") {
    tags.push('<span class="esc">' + (it.type === "short" ? "short answer \u00b7 return visit" : "harder variant \u00b7 return visit") + "</span>");
  }

  let body =
    '<p class="qmeta">' + (tags.length ? tags.join(" &nbsp;\u00b7&nbsp; ") : "&nbsp;") + "</p>" +
    '<p class="qstem">' + esc(it.stem) + "</p>";

  if (it.type === "mc") {
    body += '<ul class="opts" id="opts">';
    it.order.forEach((origIdx, dispIdx) => {
      const letter = String.fromCharCode(65 + dispIdx);
      let cls = "opt";
      if (RUN.revealed) {
        if (dispIdx === it.correctIdx) cls += " right";
        else if (dispIdx === RUN.selected) cls += " wrong";
      } else if (RUN.selected === dispIdx) cls += " sel";
      body += "<li><button class=\"" + cls + '" data-i="' + dispIdx + '"' +
        (RUN.revealed ? " disabled" : "") + '><span class="mk">' + letter + "</span>" +
        "<span>" + esc(it.options[origIdx]) + "</span></button></li>";
    });
    body += "</ul>";
  } else {
    body += '<textarea class="sm" id="shortBox" placeholder="A sentence or two, from memory."' +
      (RUN.revealed ? " disabled" : "") + ">" + esc(RUN.shortText) + "</textarea>";
    if (!RUN.revealed) {
      body += '<div class="btn-row"><button class="btn btn-quiet btn-sm" id="shortDone">I\u2019ve written my answer</button></div>';
    }
  }

  /* confidence tap — required before reveal */
  const readyForConfidence = it.type === "mc" ? (RUN.selected !== null) : RUN.shortReady;
  if (!RUN.revealed && readyForConfidence) {
    body += '<div class="conf"><p>Before you see the answer — how sure are you?</p>' +
      '<div class="btn-row" style="margin-top:0">' +
      '<button class="btn" data-conf="sure">Sure</button>' +
      '<button class="btn btn-quiet" data-conf="unsure">Unsure</button>' +
      "</div></div>";
  }

  if (RUN.revealed) {
    const last = RUN.results[RUN.results.length - 1];
    const ok = last.correct;
    body += '<div class="reveal">' +
      '<div class="verdict ' + (ok ? "ok" : "no") + '">' +
        (ok ? "Correct" : "Missed") +
        "<small>you said you were " + (last.sure ? "sure" : "unsure") + "</small></div>";
    if (it.type === "short") {
      body += '<p class="kwline"><b>' + RUN.shortHits + " of " + it.keywords.length +
        "</b> key ideas matched (" + it.minKeywords + " needed). Keyword matching is crude \u2014 correct the record if it got you wrong.</p>" +
        '<p class="explain" style="margin-top:.9rem"><b>Model answer.</b> ' + esc(it.explanation) + "</p>" +
        '<div class="btn-row"><button class="btn btn-quiet btn-sm" id="flipMark">Mark this as ' +
          (ok ? "missed" : "correct") + " instead</button></div>";
    } else {
      body += '<p class="explain">' + esc(it.explanation) + "</p>";
    }
    body += '<div class="btn-row"><button class="btn" id="nextQ">' +
      (RUN.idx + 1 < RUN.items.length ? "Next question" : "See results") + "</button></div></div>";
  }

  app.innerHTML = body + sunrule();

  Array.from(document.querySelectorAll(".opt")).forEach(b => {
    b.addEventListener("click", () => {
      if (RUN.revealed) return;
      RUN.selected = parseInt(b.getAttribute("data-i"), 10);
      renderQuestion();
    });
  });
  const sb = document.getElementById("shortBox");
  if (sb) sb.addEventListener("input", () => { RUN.shortText = sb.value; });
  const sd = document.getElementById("shortDone");
  if (sd) sd.addEventListener("click", () => {
    RUN.shortText = sb.value; RUN.shortReady = true; renderQuestion();
  });
  Array.from(document.querySelectorAll("[data-conf]")).forEach(b => {
    b.addEventListener("click", () => doReveal(b.getAttribute("data-conf") === "sure"));
  });
  const fm = document.getElementById("flipMark");
  if (fm) fm.addEventListener("click", flipMark);
  const nq = document.getElementById("nextQ");
  if (nq) nq.addEventListener("click", advance);
  if (!RUN.revealed) window.scrollTo(0, 0);
}

/* Persistence happens on reveal, not on navigation. */
function doReveal(sure) {
  const it = RUN.items[RUN.idx];
  let correct;
  if (it.type === "mc") {
    correct = RUN.selected === it.correctIdx;
  } else {
    const hits = keywordHits(RUN.shortText, it.keywords);
    RUN.shortHits = hits.length;
    correct = hits.length >= it.minKeywords;
  }
  RUN.confidence = sure;
  RUN.revealed = true;
  RUN.results.push({ id: it.q.id, section: it.q.section, correct: correct, sure: sure, variant: it.variant });
  applyResult(it, correct);
  STATE.confidence.push({ d: iso(today()), qid: it.q.id, section: it.q.section, sure: sure, correct: correct });
  if (STATE.confidence.length > 600) STATE.confidence = STATE.confidence.slice(-600);
  saveProgressSnapshot();
  Store.save(STATE);
  renderQuestion();
}

function applyResult(it, correct) {
  const ist = itemState(it.q.id);
  if (correct) {
    if (it.variant === "escalated") ist.escalatedCorrect = true;
    else ist.correctOnce = true;
    const i = STATE.missed.indexOf(it.q.id);
    if (i !== -1) STATE.missed.splice(i, 1);
  } else {
    if (it.variant === "escalated") ist.escalatedCorrect = false;
    else ist.correctOnce = false;
    if (STATE.missed.indexOf(it.q.id) === -1) STATE.missed.push(it.q.id);
  }
}

function flipMark() {
  const it = RUN.items[RUN.idx];
  const last = RUN.results[RUN.results.length - 1];
  last.correct = !last.correct;
  applyResult(it, last.correct);
  const cl = STATE.confidence[STATE.confidence.length - 1];
  if (cl && cl.qid === it.q.id) cl.correct = last.correct;
  saveProgressSnapshot();
  Store.save(STATE);
  renderQuestion();
}

function advance() {
  RUN.idx++;
  RUN.selected = null; RUN.confidence = null; RUN.revealed = false;
  RUN.shortText = ""; RUN.shortHits = 0; RUN.shortReady = false;
  if (RUN.idx >= RUN.items.length) {
    delete STATE.runs[runKey(RUN.mode, RUN.sectionId)];
    finishRun();
  } else {
    saveProgressSnapshot();
    Store.save(STATE);
    renderQuestion();
  }
}

/* ===================================================================
   Screen: results
   =================================================================== */
function finishRun() {
  const total = RUN.results.length;
  const correct = RUN.results.filter(r => r.correct).length;
  const accuracy = total ? correct / total : 0;

  let scheduled = [];
  if (RUN.mode === "section") {
    const st = recordSectionAttempt(RUN.sectionId, accuracy, "section", total);
    scheduled.push({ sec: SEC_BY_ID[RUN.sectionId], due: st.dueDate, idx: st.intervalIdx, acc: accuracy });
  } else {
    // mixed run: score each represented section on its own items, but only reschedule
    // sections with enough items in this run to be meaningful (>=3)
    const bySec = {};
    RUN.results.forEach(r => {
      bySec[r.section] = bySec[r.section] || { n: 0, c: 0 };
      bySec[r.section].n++; if (r.correct) bySec[r.section].c++;
    });
    Object.keys(bySec).forEach(sid => {
      const d = bySec[sid];
      if (d.n < 3) return;
      if (!STATE.sections[sid] || STATE.sections[sid].attempts.length === 0) return;
      const a = d.c / d.n;
      const st = recordSectionAttempt(sid, a, "mixed", d.n);
      scheduled.push({ sec: SEC_BY_ID[sid], due: st.dueDate, idx: st.intervalIdx, acc: a });
    });
  }
  Store.save(STATE);
  renderResults(accuracy, correct, total, scheduled);
}

function renderResults(accuracy, correct, total, scheduled) {
  setBar({ back: true, title: "Run complete", metaMain: Math.round(accuracy * 100) + "%", metaSub: "this run", progress: 100 });

  const sureR = RUN.results.filter(r => r.sure);
  const unsureR = RUN.results.filter(r => !r.sure);
  const sureAcc = sureR.length ? sureR.filter(r => r.correct).length / sureR.length : null;
  const unsureAcc = unsureR.length ? unsureR.filter(r => r.correct).length / unsureR.length : null;
  const highConfErrors = sureR.filter(r => !r.correct).length;

  let calibNote;
  if (sureAcc === null || unsureAcc === null) {
    calibNote = "Calibration needs both kinds of answer in a run to say much. Once you've used both taps, this panel compares them.";
  } else if (highConfErrors === 0) {
    calibNote = "No high-confidence errors this run \u2014 where you felt sure, you were right.";
  } else if (sureAcc - unsureAcc < 0.15) {
    calibNote = highConfErrors + (highConfErrors === 1 ? " item" : " items") +
      " you felt sure about turned out wrong, and your accuracy when sure is close to your accuracy when unsure. That gap is where fluency is running ahead of knowledge.";
  } else {
    calibNote = "Your confidence tracks your accuracy reasonably well here, though " + highConfErrors +
      (highConfErrors === 1 ? " item" : " items") + " you felt sure about still came out wrong \u2014 those are the ones worth revisiting.";
  }

  const missedThisRun = RUN.results.filter(r => !r.correct);
  let missedList = "";
  if (missedThisRun.length) {
    missedList = "<h3>Added to the missed pool</h3><ul class=\"seclist\">";
    missedThisRun.forEach(r => {
      const q = QBY_ID[r.id];
      missedList += '<li style="padding:.45rem 0;border-top:1px solid var(--rule)">' +
        '<span style="font-family:var(--ui);font-size:.72rem;letter-spacing:.08em;color:var(--ink-faint)">' +
        esc(SEC_BY_ID[q.section].title) + "</span><br>" + esc(q.stem) + "</li>";
    });
    missedList += "</ul>";
  }

  let sched = "";
  scheduled.forEach(s => {
    sched += '<p class="nextdue"><b>' + esc(s.sec.title) + "</b> \u2014 next due <b>" + fmtDate(s.due) + "</b>" +
      " &nbsp;(" + INTERVAL_LABEL[s.idx] + " interval" +
      (s.acc < PASS_THRESHOLD ? "; below 80% this run, so the interval reset" : "") + ")</p>";
  });
  if (!sched && RUN.mode === "mixed") {
    sched = '<p class="nextdue">No section had enough items in this run to move its review date. ' +
      "Section runs, and mixed runs that happen to draw three or more from a section, adjust the schedule.</p>";
  }

  app.innerHTML =
    "<h1 style=\"font-size:1.7rem\">Run complete</h1>" +
    '<div class="statgrid">' +
      '<div class="stat"><div class="sv">' + correct + "/" + total + '</div><div class="sl">correct</div></div>' +
      '<div class="stat ochre"><div class="sv">' + Math.round(accuracy * 100) + '%</div><div class="sl">accuracy</div></div>' +
      '<div class="stat rose"><div class="sv">' + highConfErrors + '</div><div class="sl">sure but wrong</div></div>' +
    "</div>" +
    '<div class="calib"><h3>Calibration</h3><table><tr><td>Accuracy when <b>sure</b></td><td>' +
      (sureAcc === null ? "\u2014" : Math.round(sureAcc * 100) + "% of " + sureR.length) + "</td></tr>" +
      "<tr><td>Accuracy when <b>unsure</b></td><td>" +
      (unsureAcc === null ? "\u2014" : Math.round(unsureAcc * 100) + "% of " + unsureR.length) + "</td></tr></table>" +
      '<p class="note">' + calibNote + "</p></div>" +
    sched +
    missedList +
    sunrule() +
    '<div class="btn-row"><button class="btn" id="goHome">Back to sections</button>' +
    (anyFirstPassDone() ? '<button class="btn btn-quiet" id="goMixed">Another mixed review</button>' : "") +
    "</div>";

  document.getElementById("goHome").addEventListener("click", renderHome);
  const gm = document.getElementById("goMixed");
  if (gm) gm.addEventListener("click", () => { startRun("mixed", null); renderRecall(); });
  window.scrollTo(0, 0);
}

/* ===================================================================
   Boot
   =================================================================== */
tbBack.addEventListener("click", renderHome);

(async function boot() {
  const loaded = await Store.load();
  if (loaded && loaded.version === 1) {
    STATE = Object.assign(blankState(), loaded);
    STATE.sections = loaded.sections || {};
    STATE.items = loaded.items || {};
    STATE.missed = (loaded.missed || []).filter(id => QBY_ID[id]);
    STATE.confidence = loaded.confidence || [];
    STATE.runs = loaded.runs || {};
    Object.keys(STATE.runs).forEach(key => {
      const r = STATE.runs[key];
      if (!r || !Array.isArray(r.items) || !r.items.every(it => it && it.q && QBY_ID[it.q.id])) {
        delete STATE.runs[key];
      }
    });
  }
  renderHome();
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
